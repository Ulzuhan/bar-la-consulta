<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar La Consulta, laboratorio de SQL</title>
<meta name="description" content="Laboratorio de SQL del Bar La Consulta: SQLite en el navegador, con ejercicios que se corrigen solos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
<style>
/* Paleta del bar: azulejo, pizarra y caña */
:root {
  --ancho: 1400px;
  --fondo: #edf1ed;
  --superficie: #ffffff;
  --superficie-2: #e3e9e4;
  --borde: #cfd8d1;
  --tinta: #1c2420;
  --tinta-suave: #56625b;
  --pizarra: #1f3b30;
  --pizarra-tinta: #eef3ee;
  --boton: #1f3b30;
  --boton-hover: #2c5143;
  --cana: #94650a;
  --cana-linea: #d29a2a;
  --enlace: #1b6a4f;
  --ok: #23744a;
  --ok-suave: #ddefe3;
  --mal: #b0332a;
  --mal-suave: #f7e0dd;
  --aviso: #855700;
  --aviso-suave: #faefd2;
  --codigo-fondo: #ffffff;
  --nulo: #87928b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #121715; --superficie: #1a201d; --superficie-2: #232b27; --borde: #33403a;
    --tinta: #e5ebe7; --tinta-suave: #9eaba3; --pizarra: #17291f; --pizarra-tinta: #e8efe9;
    --boton: #3b7a5f; --boton-hover: #48906f; --cana: #e3ad48; --cana-linea: #e3ad48; --enlace: #84d0ac;
    --ok: #79c79a; --ok-suave: #1d3327; --mal: #f2928a; --mal-suave: #3d2321;
    --aviso: #e8b65a; --aviso-suave: #3a2f1a; --codigo-fondo: #151a18; --nulo: #7c8881;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #121715; --superficie: #1a201d; --superficie-2: #232b27; --borde: #33403a;
  --tinta: #e5ebe7; --tinta-suave: #9eaba3; --pizarra: #17291f; --pizarra-tinta: #e8efe9;
  --boton: #3b7a5f; --boton-hover: #48906f; --cana: #e3ad48; --cana-linea: #e3ad48; --enlace: #84d0ac;
  --ok: #79c79a; --ok-suave: #1d3327; --mal: #f2928a; --mal-suave: #3d2321;
  --aviso: #e8b65a; --aviso-suave: #3a2f1a; --codigo-fondo: #151a18; --nulo: #7c8881;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--fondo);
  color: var(--tinta);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
/* monoespaciada solo para lo que es SQL: el editor, los resultados y los nombres de tablas y columnas */
code, textarea, .tabla-res, .col-nombre, .tabla-nombre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
a { color: var(--enlace); text-underline-offset: 2px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cana-linea); outline-offset: 2px; }

/* cabecera */
.cabecera { background: var(--pizarra); color: var(--pizarra-tinta); }
.cabecera-in {
  max-width: var(--ancho); margin: 0 auto; padding: 10px 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap;
}
.marca { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.rotulo { font-family: "Bree Serif", Georgia, serif; font-size: 27px; letter-spacing: .3px; }
.lema { font-size: 14px; opacity: .78; }
.acciones { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.estado-bd { opacity: .8; }
.btn-claro {
  background: transparent; color: var(--pizarra-tinta);
  border: 1px solid rgba(238, 243, 238, .4); border-radius: 6px; padding: 5px 10px; font-size: 14px;
}
.btn-claro:hover { background: rgba(238, 243, 238, .1); }
a.btn-claro { text-decoration: none; display: inline-block; }
.solo-lector { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* pestañas */
.pestanas { position: sticky; top: 0; z-index: 5; background: var(--superficie); border-bottom: 1px solid var(--borde); }
.pestanas-in { max-width: var(--ancho); margin: 0 auto; padding: 0 16px; }
.grupo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 2px; }
.grupo + .grupo { border-top: 1px solid var(--borde); }
.grupo-nombre { flex: none; width: 70px; padding-left: 8px; font-size: 12.5px; color: var(--tinta-suave); }
.pestana {
  background: none; border: none; border-bottom: 3px solid transparent;
  padding: 8px 6px 6px; color: var(--tinta-suave); white-space: nowrap; font-size: 14.5px;
}
.pestana:hover { color: var(--tinta); }
.pestana[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--cana-linea); font-weight: 600; }
.progreso { font-size: 12px; margin-left: 4px; padding: 1px 5px; border-radius: 10px; background: var(--superficie-2); color: var(--tinta-suave); font-weight: 500; }
.progreso.completo { background: var(--ok-suave); color: var(--ok); }
.progreso:empty { display: none; }

/* cuerpo y panel de tablas */
.cuerpo { max-width: var(--ancho); margin: 0 auto; display: grid; grid-template-columns: clamp(220px, 19vw, 260px) minmax(0, 1fr); align-items: start; }
.panel {
  position: sticky; top: var(--alto-pestanas, 76px); max-height: calc(100vh - var(--alto-pestanas, 76px)); overflow-y: auto;
  border-right: 1px solid var(--borde); padding: 18px 12px 40px; font-size: 14px;
}
.plegable > summary { display: none; }
.panel h2 { font-size: 14px; color: var(--tinta); margin: 4px 6px 6px; font-weight: 600; }
.panel h2.segundo { margin-top: 20px; }
.panel .ayuda { color: var(--tinta-suave); font-size: 13px; margin: 0 6px 14px; transition: color .2s; }
.panel .ayuda.llamada { color: var(--aviso); font-weight: 600; }
.tabla { margin-bottom: 1px; }
.tabla summary { list-style: none; cursor: pointer; padding: 4px 6px; border-radius: 6px; display: flex; align-items: baseline; gap: 6px; }
.tabla summary::-webkit-details-marker { display: none; }
.tabla summary:hover { background: var(--superficie-2); }
.tabla summary::before { content: "▸"; color: var(--tinta-suave); width: 10px; }
.tabla[open] summary::before { content: "▾"; }
.tabla-nombre { font-weight: 600; flex: 1; color: var(--tinta); font-size: 14px; }
.tabla-filas { color: var(--tinta-suave); font-size: 12px; white-space: nowrap; }
.columnas { list-style: none; margin: 2px 0 10px 22px; padding: 0; }
.columnas li { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.col-nombre { background: none; border: none; padding: 2px 4px; margin-left: -4px; border-radius: 4px; color: var(--enlace); font-size: 13.5px; text-align: left; }
.col-nombre:hover { background: var(--superficie-2); text-decoration: underline; }
.col-tipo { color: var(--tinta-suave); font-size: 12px; }

/* bloques */
main { padding: 24px 32px 80px; min-width: 0; }
.bloque { display: none; }
.bloque.activo { display: block; }
.bloque > h1 { font-family: "Bree Serif", Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
.intro { color: var(--tinta-suave); margin: 0 0 6px; max-width: 70ch; }
.docs { font-size: 14px; color: var(--tinta-suave); margin: 0 0 8px; }
.docs a { margin-left: 8px; }
.docs > a:first-child { margin-left: 0; }
.docs-et { white-space: nowrap; }
.seccion { font-size: 19px; font-weight: 600; margin: 30px 0 2px; }
.ayuda-seccion { color: var(--tinta-suave); margin: 0 0 14px; font-size: 15px; }

/* ejemplos: los escribe el profe, ellos copian */
.ejemplo { border-left: 3px solid var(--boton); padding: 2px 0 2px 14px; margin-bottom: 22px; }
.cab-ejemplo { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.desc-ejemplo { color: var(--tinta); }
.ejemplo .num { font-size: 14px; }
.btn-ver { font-size: 13.5px; }
.codigo-ejemplo { background: var(--superficie-2); border-radius: 6px; padding: 8px 12px; margin: 6px 0 4px; font-size: 14.5px; overflow-x: auto; }
.tarjeta.dueno { border-color: var(--cana-linea); }
.tarjeta.dueno.resuelto { border-left-color: var(--ok); }
.btn-ir-acusar { margin-top: 10px; background: none; border: 1px solid var(--boton); color: var(--tinta); border-radius: 6px; padding: 5px 12px; font-size: 14px; }
.btn-ir-acusar:hover { background: var(--superficie-2); }

/* ejercicios y pasos de la misión */
.tarjeta {
  background: var(--superficie); border: 1px solid var(--borde); border-radius: 8px;
  padding: 14px 16px; margin-bottom: 14px;
}
.tarjeta.resuelto { border-left: 4px solid var(--ok); padding-left: 13px; }
.cab-tarjeta { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.num { font-weight: 700; color: var(--cana); font-variant-numeric: tabular-nums; }
.titulo-paso { font-weight: 600; }
.marca-ok { margin-left: auto; color: var(--ok); font-weight: 600; font-size: 14px; }
.enunciado { margin: 0 0 4px; max-width: 75ch; }
.esperado { font-size: 14px; color: var(--tinta-suave); margin: 0 0 8px; }
.btn-pista { background: none; border: none; color: var(--enlace); padding: 0; font-size: 14px; text-decoration: underline; text-underline-offset: 2px; }
.btn-original { margin-left: auto; }
.pista { font-size: 14px; color: var(--tinta); background: var(--aviso-suave); border-radius: 6px; padding: 6px 10px; margin: 0 0 8px; max-width: 75ch; }

/* editor */
.editor { margin-top: 6px; }
textarea {
  width: 100%; min-height: 64px; resize: vertical;
  background: var(--codigo-fondo); color: var(--tinta);
  border: 1px solid var(--borde); border-radius: 6px;
  padding: 10px 12px; font-size: 16px; line-height: 1.5; tab-size: 2;
}
textarea::placeholder { color: var(--nulo); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
textarea:focus { outline: 2px solid var(--boton); outline-offset: 0; border-color: transparent; }
.barra-editor { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.btn-ejecutar {
  background: var(--boton); color: #fff; border: none; border-radius: 6px;
  padding: 7px 18px; font-weight: 600; font-size: 15px;
}
.btn-ejecutar:hover { background: var(--boton-hover); }
.atajo { font-size: 13px; color: var(--tinta-suave); }

/* resultados */
.resultado { margin-top: 10px; }
.resumen { font-size: 14px; color: var(--tinta-suave); margin-bottom: 6px; }
.envoltura-tabla { overflow: auto; max-height: 360px; border: 1px solid var(--borde); border-radius: 6px; background: var(--superficie); }
.tabla-res { border-collapse: collapse; font-size: 14px; width: max-content; min-width: 100%; }
.tabla-res th, .tabla-res td { padding: 5px 12px; border-bottom: 1px solid var(--borde); text-align: left; white-space: nowrap; }
.tabla-res td.texto-largo { white-space: normal; min-width: 320px; max-width: 640px; }
.tabla-res th { position: sticky; top: 0; background: var(--superficie-2); font-weight: 600; }
.tabla-res td.numero { text-align: right; font-variant-numeric: tabular-nums; }
.tabla-res td.nulo { color: var(--nulo); font-style: italic; }
.tabla-res tr:last-child td { border-bottom: none; }
.aviso { border-radius: 6px; padding: 9px 12px; font-size: 15px; margin-top: 10px; max-width: 90ch; }
.aviso.error { background: var(--mal-suave); color: var(--mal); }
.aviso.error .original { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; opacity: .8; margin-top: 4px; }
.aviso.ok { background: var(--ok-suave); color: var(--ok); font-weight: 600; }
.aviso.mal { background: var(--aviso-suave); color: var(--aviso); }
.aviso.neutro { background: var(--superficie-2); color: var(--tinta-suave); }

/* misión: la historia en la pizarra */
.historia { background: var(--pizarra); color: var(--pizarra-tinta); border-radius: 8px; padding: 18px 22px; margin: 4px 0 20px; }
.historia p { margin: 0 0 8px; max-width: 75ch; }
.historia p:last-child { margin-bottom: 0; }
.acusar {
  background: var(--superficie); border: 2px solid var(--boton); border-radius: 8px;
  padding: 18px; margin-top: 28px;
}
.acusar h2 { font-family: "Bree Serif", Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 2px; }
.acusar .explica { margin: 0 0 12px; color: var(--tinta-suave); max-width: 75ch; }
.acusar form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.acusar input {
  flex: 1; min-width: 180px; font: inherit; padding: 7px 10px;
  border: 1px solid var(--borde); border-radius: 6px; background: var(--codigo-fondo); color: var(--tinta);
}
.acusar input.importe { flex: 0 1 200px; min-width: 150px; }
.respuesta { position: relative; margin-top: 12px; padding: 10px 12px; border-radius: 6px; display: none; }
.respuesta.visible { display: block; }
.respuesta .quien { font-weight: 700; display: block; margin-bottom: 2px; padding-right: 28px; }
.cerrar { position: absolute; top: 4px; right: 6px; background: none; border: none; font-size: 20px; line-height: 1; color: inherit; opacity: .7; padding: 4px 6px; }
.cerrar:hover { opacity: 1; }
.respuesta.no { background: var(--superficie-2); }
.respuesta.giro { background: var(--aviso-suave); color: var(--aviso); }
.respuesta.culpable { background: var(--ok-suave); color: var(--ok); }
.respuesta.nadie { background: var(--superficie-2); color: var(--tinta-suave); }
.sello {
  display: inline-block; margin: 12px 0 4px; padding: 4px 14px;
  font-family: "Bree Serif", Georgia, serif; font-size: 26px; letter-spacing: .06em;
  color: var(--mal); border: 3px solid var(--mal); border-radius: 6px;
  transform: rotate(-4deg); animation: sellar .35s ease-out;
}
@keyframes sellar { from { transform: rotate(-4deg) scale(1.8); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
.tras-sello { margin: 6px 0 0; }

.pie { font-size: 13.5px; color: var(--tinta-suave); border-top: 1px solid var(--borde); margin-top: 40px; padding-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; }
.pie a { color: var(--tinta-suave); }
.pie button { background: none; border: none; color: var(--tinta-suave); text-decoration: underline; text-underline-offset: 2px; padding: 0; font-size: 13.5px; }
.carga { padding: 60px 20px; text-align: center; color: var(--tinta-suave); }
.sin-guardar { background: var(--aviso-suave); color: var(--aviso); border-bottom: 1px solid var(--borde); }
.sin-guardar-in { max-width: var(--ancho); margin: 0 auto; padding: 10px 24px; font-weight: 600; font-size: 15px; }

@media (max-width: 760px) {
  .cuerpo { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--borde); padding: 4px 16px 6px; }
  .plegable > summary { display: block; list-style: none; cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 15px; }
  .plegable > summary::-webkit-details-marker { display: none; }
  .plegable > summary::before { content: "▸"; color: var(--tinta-suave); margin-right: 8px; }
  .plegable[open] > summary::before { content: "▾"; }
  .plegable[open] > summary { margin-bottom: 6px; }
  .atajo { display: none; }
  main { padding: 18px 16px 60px; }
  .cabecera-in { padding: 10px 16px; }
  .pestanas { position: static; }
  .pestanas-in { padding: 0 8px; }
  .grupo-nombre { width: 100%; padding: 6px 6px 0; }
  .pestana { font-size: 13.5px; padding: 5px 6px 4px; }
  .rotulo { font-size: 22px; }
  .lema { font-size: 13px; }
  .acciones { width: 100%; flex-wrap: wrap; gap: 6px; }
  .estado-bd { display: none; }
  .btn-claro { white-space: nowrap; font-size: 13px; padding: 4px 9px; }
  .sin-guardar-in { padding: 10px 16px; font-size: 14px; }
  .bloque > h1 { font-size: 25px; }
  .tarjeta { padding: 12px; }
  .tarjeta.resuelto { padding-left: 9px; }
  .acusar { padding: 14px; }
  .acusar input, .acusar input.importe { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { .sello { animation: none; } .panel .ayuda { transition: none; } }
</style>
</head>
<body>
<header class="cabecera">
 <div class="cabecera-in">
  <div class="marca">
    <div class="rotulo">Bar La Consulta</div>
    <div class="lema">Laboratorio de SQL</div>
  </div>
  <div class="acciones">
    <span class="estado-bd" id="estado-bd">Cargando la base de datos…</span>
    <a class="btn-claro" href="teoria.html" target="_blank" rel="noopener" title="La teoría de la clase, en otra pestaña">Teoría</a>
    <button class="btn-claro" id="btn-descargar" type="button" title="Baja un archivo con todas tus consultas, para guardarlas o seguir en otro ordenador">Descargar mi trabajo</button>
    <button class="btn-claro" id="btn-cargar" type="button" title="Recupera tus consultas desde un archivo que bajaste antes">Cargar mi trabajo</button>
    <input type="file" id="archivo-trabajo" accept=".sql,.txt,text/plain" hidden>
    <button class="btn-claro" id="btn-restaurar" type="button" title="Vuelve a cargar los datos originales del bar">Restaurar la base de datos</button>
  </div>
 </div>
</header>
<nav class="pestanas" aria-label="Bloques de la clase"><div class="pestanas-in" id="pestanas" role="tablist"></div></nav>
<div class="solo-lector" id="anuncio" role="status" aria-live="polite"></div>
<div class="sin-guardar" id="sin-guardar" role="alert" hidden><div class="sin-guardar-in">Este navegador no guarda lo que escribes: si recargas o cierras la página, lo perderás. Antes de salir, pulsa "Descargar mi trabajo". Para no tener este problema, abre la página en Chrome y sin modo incógnito.</div></div>
<div class="cuerpo">
  <aside class="panel" id="panel" aria-label="Tablas de la base de datos"></aside>
  <main id="contenido"><div class="carga">Cargando…</div></main>
</div>

<script>
const DATOS = {"bloques": [{"id": "b0", "pestana": "0. Abrimos", "titulo": "Abrimos el bar", "intro": "La carta del bar ya no está en un CSV. Ahora está en una base de datos, junto con el personal y todas las comandas desde el 1 de octubre. En el panel de tablas puedes ver qué hay en cada una.", "docs": [["SELECT", "https://www.w3schools.com/sql/sql_select.asp"]], "teoria": "base-de-datos", "ejemplos": [{"id": "0.a", "texto": "La carta entera.", "sql": "SELECT * FROM carta;"}], "ejercicios": [{"id": "0.1", "enunciado": "Muestra la tabla personal entera.", "pista": "Mira en el panel de tablas cómo se llama la del personal.", "esperado": {"filas": 15, "cols": 5, "h": 5886390536789155, "ho": null}}, {"id": "0.2", "enunciado": "Muestra la tabla comandas entera. ¿Cuántas comandas hay?", "pista": "¿Cómo se llama la tabla de las comandas? El número de filas sale encima del resultado.", "esperado": {"filas": 966, "cols": 10, "h": 7414595535991327, "ho": null}}]}, {"id": "b1", "pestana": "1. SELECT", "titulo": "SELECT, LIMIT y DISTINCT", "intro": "", "docs": [["SELECT", "https://www.w3schools.com/sql/sql_select.asp"], ["LIMIT", "https://www.w3schools.com/sql/sql_top.asp"], ["DISTINCT", "https://www.w3schools.com/sql/sql_distinct.asp"], ["AS", "https://www.w3schools.com/sql/sql_alias.asp"]], "teoria": "select", "ejemplos": [{"id": "1.a", "texto": "Solo el plato y el precio de la carta.", "sql": "SELECT plato, precio FROM carta;"}, {"id": "1.b", "texto": "Las 5 primeras comandas.", "sql": "SELECT * FROM comandas LIMIT 5;"}, {"id": "1.c", "texto": "Las categorías de la carta, sin repetir.", "sql": "SELECT DISTINCT categoria FROM carta;"}, {"id": "1.d", "texto": "Cómo quedarían los precios con una subida del 10 %.", "sql": "SELECT plato, precio, precio * 1.10 AS precio_nuevo FROM carta;"}], "ejercicios": [{"id": "1.1", "enunciado": "Muestra el nombre y el puesto de todo el personal.", "pista": "Mira en el panel cómo se llaman esas dos columnas en la tabla personal.", "esperado": {"filas": 15, "cols": 2, "h": 2366688185726319, "ho": null}}, {"id": "1.2", "enunciado": "Muestra la fecha, la hora y el total de cada comanda.", "pista": "Tres columnas, separadas por comas. Los nombres exactos están en el panel.", "esperado": {"filas": 966, "cols": 3, "h": 5328054439569138, "ho": null}}, {"id": "1.3", "enunciado": "Muestra las 10 primeras filas de la tabla fichajes.", "pista": "Hay una palabra que va al final de la consulta y dice cuántas filas quieres.", "esperado": {"filas": 10, "cols": 4, "h": 7588685026824367, "ho": null}}, {"id": "1.4", "enunciado": "¿En qué zonas del bar se sirven comandas? Que salga cada zona una sola vez.", "pista": "Hay una palabra, justo después de SELECT, que quita las repeticiones.", "esperado": {"filas": 3, "cols": 1, "h": 8018681306872162, "ho": null}}, {"id": "1.5", "enunciado": "¿Cómo pagan los clientes? Que salga cada forma de pago una sola vez.", "pista": "Lo mismo que antes: ¿qué columna dice cómo se pagó?", "esperado": {"filas": 3, "cols": 1, "h": 6462278234450831, "ho": null}}, {"id": "1.6", "enunciado": "El dueño quiere hacer un 20 % de descuento en toda la carta. Muestra el plato, el precio y el precio con el descuento (precio * 0.8) en una columna llamada precio_oferta.", "pista": "En el SELECT se puede multiplicar una columna, y AS le pone nombre al resultado.", "esperado": {"filas": 30, "cols": 3, "h": 5474413180913050, "ho": null}}, {"id": "1.7", "enunciado": "¿Cuánto pagó cada comensal? Muestra el id, el total, los comensales y el total dividido entre los comensales, en una columna llamada por_persona.", "pista": "Se pueden hacer cuentas con dos columnas a la vez. Para dividir se usa /.", "esperado": {"filas": 966, "cols": 4, "h": 8560254377918112, "ho": null}}]}, {"id": "b2", "pestana": "2. WHERE", "titulo": "WHERE", "intro": "", "docs": [["WHERE", "https://www.w3schools.com/sql/sql_where.asp"]], "teoria": "where", "ejemplos": [{"id": "2.a", "texto": "Los platos de más de 10 €.", "sql": "SELECT plato, precio\nFROM carta\nWHERE precio > 10;"}, {"id": "2.b", "texto": "Los postres.", "sql": "SELECT plato, categoria\nFROM carta\nWHERE categoria = 'postres';"}, {"id": "2.c", "texto": "Las comandas que se pagaron con bizum.", "sql": "SELECT *\nFROM comandas\nWHERE pago = 'bizum';"}, {"id": "2.d", "texto": "Las comandas del día de Halloween.", "sql": "SELECT *\nFROM comandas\nWHERE fecha = '2026-10-31';"}], "ejercicios": [{"id": "2.1", "enunciado": "¿Qué hay en la carta por menos de 3 €? Muestra el plato y el precio.", "pista": "Una condición sobre el precio. ¿Mayor o menor que?", "esperado": {"filas": 5, "cols": 2, "h": 4646416069873021, "ho": null}}, {"id": "2.2", "enunciado": "¿Qué platos son vegetarianos? Muestra solo el plato. En la columna vegetariano pone 'si' o 'no'.", "pista": "Una condición sobre la columna vegetariano. Los textos van entre comillas.", "esperado": {"filas": 20, "cols": 1, "h": 3745851965672653, "ho": null}}, {"id": "2.3", "enunciado": "¿Quién trabaja en el turno de noche? Muestra el nombre y el turno.", "pista": "¿En qué tabla está el turno de cada persona?", "esperado": {"filas": 9, "cols": 2, "h": 97384690383492, "ho": null}}, {"id": "2.4", "enunciado": "Muestra todas las comandas de la terraza.", "pista": "El texto tiene que ser exacto: mira cómo está escrita la zona en los datos.", "esperado": {"filas": 247, "cols": 10, "h": 4685123881681168, "ho": null}}, {"id": "2.5", "enunciado": "¿Qué comandas dejaron más de 5 € de propina? Muestra el id, el total y la propina.", "pista": "La condición es sobre la propina.", "esperado": {"filas": 31, "cols": 3, "h": 5837886096188626, "ho": null}}, {"id": "2.6", "enunciado": "¿Qué comandas fueron de grupos de 10 personas o más? Muestra todas sus columnas.", "pista": "\"10 o más\" incluye el 10: ¿qué comparador lo incluye?", "esperado": {"filas": 6, "cols": 10, "h": 3307062743725653, "ho": null}}, {"id": "2.7", "enunciado": "Muestra todas las comandas del sábado 7 de noviembre de 2026.", "pista": "Las fechas van entre comillas y con el formato año-mes-día.", "esperado": {"filas": 50, "cols": 10, "h": 787907258404139, "ho": null}}, {"id": "2.8", "enunciado": "Muestra el plato y la categoría de todo lo que no sea bebida.", "pista": "Hay un comparador que significa \"distinto de\". Está en la documentación del WHERE.", "esperado": {"filas": 23, "cols": 2, "h": 5921879028240156, "ho": null}}, {"id": "2.9", "enunciado": "El dueño quiere reunir a todo el personal de cocina. ¿A quién tiene que llamar?", "pista": "¿En qué tabla está el personal? ¿Qué columna dice dónde trabaja cada uno?", "abierta": true, "titulo": "Pregunta del dueño", "esperado": {"filas": 4, "claves": [7451263137461174, 6852123584940915, 1069303903261182, 4127640670947521]}}]}, {"id": "b3", "pestana": "3. AND, OR, LIKE", "titulo": "AND, OR, IN, BETWEEN y LIKE", "intro": "", "docs": [["AND", "https://www.w3schools.com/sql/sql_and.asp"], ["OR", "https://www.w3schools.com/sql/sql_or.asp"], ["IN", "https://www.w3schools.com/sql/sql_in.asp"], ["BETWEEN", "https://www.w3schools.com/sql/sql_between.asp"], ["LIKE", "https://www.w3schools.com/sql/sql_like.asp"]], "teoria": "and-or", "ejemplos": [{"id": "3.a", "texto": "Las tapas de menos de 4 €.", "sql": "SELECT plato, precio\nFROM carta\nWHERE categoria = 'tapas' AND precio < 4;"}, {"id": "3.b", "texto": "Los postres y las bebidas.", "sql": "SELECT plato, categoria\nFROM carta\nWHERE categoria = 'postres' OR categoria = 'bebidas';"}, {"id": "3.c", "texto": "Los postres y las bebidas, otra vez, pero con IN.", "sql": "SELECT plato, categoria\nFROM carta\nWHERE categoria IN ('postres', 'bebidas');"}, {"id": "3.d", "texto": "Lo que cuesta entre 5 y 8 €.", "sql": "SELECT plato, precio\nFROM carta\nWHERE precio BETWEEN 5 AND 8;"}, {"id": "3.e", "texto": "Los platos que empiezan por \"Bocadillo\".", "sql": "SELECT plato\nFROM carta\nWHERE plato LIKE 'Bocadillo%';"}, {"id": "3.f", "texto": "Los platos que llevan queso.", "sql": "SELECT plato\nFROM carta\nWHERE plato LIKE '%queso%';"}, {"id": "3.g", "texto": "Tapas y raciones de más de 10 €. ¿Sale lo que esperabas?", "sql": "SELECT plato, categoria, precio\nFROM carta\nWHERE categoria = 'tapas' OR categoria = 'raciones' AND precio > 10;"}], "ejercicios": [{"id": "3.1", "enunciado": "¿Qué platos vegetarianos cuestan menos de 5 €? Muestra el plato y el precio.", "pista": "Dos condiciones que se tienen que cumplir a la vez.", "esperado": {"filas": 14, "cols": 2, "h": 4155023067499478, "ho": null}}, {"id": "3.2", "enunciado": "Muestra las comandas de la terraza que se pagaron en efectivo.", "pista": "Dos condiciones a la vez: una sobre la zona y otra sobre la forma de pago.", "esperado": {"filas": 77, "cols": 10, "h": 1940083150052514, "ho": null}}, {"id": "3.3", "enunciado": "¿Quién trabaja en cocina o en barra? Muestra el nombre y el puesto.", "pista": "Basta con que se cumpla una de las dos condiciones.", "esperado": {"filas": 6, "cols": 2, "h": 122627448017096, "ho": null}}, {"id": "3.4", "enunciado": "Haz el 3.3 otra vez, pero con IN.", "pista": "IN recibe una lista de valores entre paréntesis.", "esperado": {"filas": 6, "cols": 2, "h": 122627448017096, "ho": null}}, {"id": "3.5", "enunciado": "¿Qué platos cuestan entre 3 y 5 €, los dos incluidos? Muestra el plato y el precio.", "pista": "Hay una palabra para los rangos, y los extremos cuentan.", "esperado": {"filas": 14, "cols": 2, "h": 3335793027674289, "ho": null}}, {"id": "3.6", "enunciado": "Muestra las comandas de la semana de Halloween, del lunes 26 de octubre al domingo 1 de noviembre de 2026.", "pista": "Un rango, como con los precios, pero de fechas.", "esperado": {"filas": 192, "cols": 10, "h": 2668396551492717, "ho": null}}, {"id": "3.7", "enunciado": "¿Qué platos llevan patatas? Busca la palabra en el nombre y muestra solo el plato.", "pista": "La palabra puede estar en cualquier parte del nombre, delante o detrás.", "esperado": {"filas": 3, "cols": 1, "h": 3425571167191592, "ho": null}}, {"id": "3.8", "enunciado": "Muestra las comandas de la terraza o de la barra que se pagaron con bizum.", "pista": "Mezcla AND y OR. Acuérdate de lo que pasaba en el 3.g.", "esperado": {"filas": 46, "cols": 10, "h": 8231594760886560, "ho": null}}, {"id": "3.9", "enunciado": "Llega un cliente vegetariano que quiere picar tapas o raciones, sin pasar de 5 € por plato. ¿Qué le puedes ofrecer?", "pista": "Hacen falta tres condiciones de la carta: la categoría, si es vegetariano y el precio.", "abierta": true, "titulo": "Pregunta del dueño", "esperado": {"filas": 4, "claves": [1926663533069351, 8488902398208359, 5706977646674869, 7884539618268357]}}]}, {"id": "b4", "pestana": "4. ORDER BY", "titulo": "ORDER BY", "intro": "", "docs": [["ORDER BY", "https://www.w3schools.com/sql/sql_orderby.asp"], ["LIMIT", "https://www.w3schools.com/sql/sql_top.asp"]], "teoria": "order-by", "ejemplos": [{"id": "4.a", "texto": "La carta, de lo más barato a lo más caro.", "sql": "SELECT plato, precio\nFROM carta\nORDER BY precio;"}, {"id": "4.b", "texto": "La carta al revés: de lo más caro a lo más barato.", "sql": "SELECT plato, precio\nFROM carta\nORDER BY precio DESC;"}, {"id": "4.c", "texto": "Los 5 platos más caros.", "sql": "SELECT plato, precio\nFROM carta\nORDER BY precio DESC\nLIMIT 5;"}, {"id": "4.d", "texto": "Las raciones, de la más cara a la más barata.", "sql": "SELECT plato, precio\nFROM carta\nWHERE categoria = 'raciones'\nORDER BY precio DESC;"}], "ejercicios": [{"id": "4.1", "enunciado": "Ordena al personal por antigüedad, de quien lleva más tiempo en el bar a quien acaba de llegar. Muestra el nombre y la fecha de alta.", "pista": "La fecha más antigua es la más pequeña.", "esperado": {"filas": 15, "cols": 2, "h": 4192637927268008, "ho": 4192637927268008}}, {"id": "4.2", "enunciado": "¿Cuáles son las 3 propinas más altas? Muestra el id de la comanda y la propina.", "pista": "Ordena por la propina y quédate con las primeras. ¿De mayor a menor o al revés?", "esperado": {"filas": 3, "cols": 2, "h": 2048329512905348, "ho": 3525265203444851}}, {"id": "4.3", "enunciado": "¿Cuáles son las 5 comandas más caras? Muestra el id, la fecha y el total.", "pista": "Un top: ordenar y quedarse con unas pocas.", "esperado": {"filas": 5, "cols": 3, "h": 5491140082731855, "ho": 2062581347407709}}, {"id": "4.4", "enunciado": "¿Qué es lo más barato de la carta? Muestra el plato y el precio.", "pista": "Ordena por el precio y quédate con una sola fila.", "esperado": {"filas": 1, "cols": 2, "h": 8349043768700767, "ho": null}}, {"id": "4.5", "enunciado": "Ordena al personal de sala del que llegó más tarde al que lleva más tiempo. Muestra el nombre y la fecha de alta.", "pista": "Primero se filtra y después se ordena. Quien llegó más tarde tiene la fecha más grande.", "esperado": {"filas": 6, "cols": 2, "h": 8004973105929996, "ho": 6355926327926891}}, {"id": "4.6", "enunciado": "¿Cuáles son las 3 tapas vegetarianas más caras? Muestra el plato y el precio.", "pista": "Filtrar, ordenar y quedarse con unas pocas.", "esperado": {"filas": 3, "cols": 2, "h": 1825490157354325, "ho": 5131670547821226}}, {"id": "4.7", "enunciado": "¿Quién es la última persona que ha empezado a trabajar en el bar?", "pista": "La última en llegar es la que tiene la fecha de alta más reciente.", "abierta": true, "titulo": "Pregunta del dueño", "esperado": {"filas": 1, "claves": [1069303903261182]}}]}, {"id": "b5", "pestana": "5. COUNT, SUM", "titulo": "COUNT, SUM, AVG, MIN y MAX", "intro": "", "docs": [["COUNT", "https://www.w3schools.com/sql/sql_count.asp"], ["SUM", "https://www.w3schools.com/sql/sql_sum.asp"], ["AVG", "https://www.w3schools.com/sql/sql_avg.asp"], ["MIN y MAX", "https://www.w3schools.com/sql/sql_min_max.asp"], ["ROUND", "https://www.sqlite.org/lang_corefunc.html#round"]], "teoria": "funciones", "ejemplos": [{"id": "5.a", "texto": "Cuántas comandas hay.", "sql": "SELECT COUNT(*) FROM comandas;"}, {"id": "5.b", "texto": "Cuántas comandas se pagaron en efectivo.", "sql": "SELECT COUNT(*) AS num_comandas\nFROM comandas\nWHERE pago = 'efectivo';"}, {"id": "5.c", "texto": "Cuánto se ha facturado en total.", "sql": "SELECT SUM(total) AS facturacion FROM comandas;"}, {"id": "5.d", "texto": "El ticket medio, con 2 decimales.", "sql": "SELECT ROUND(AVG(total), 2) AS ticket_medio FROM comandas;"}, {"id": "5.e", "texto": "El precio más barato y el más caro de la carta.", "sql": "SELECT MIN(precio) AS mas_barato, MAX(precio) AS mas_caro FROM carta;"}], "ejercicios": [{"id": "5.1", "enunciado": "¿Cuántas personas trabajan en el bar?", "pista": "Hay una función que cuenta filas.", "esperado": {"filas": 1, "cols": 1, "h": 1982482754516037, "ho": null}}, {"id": "5.2", "enunciado": "¿Cuántas comandas se pagaron con bizum?", "pista": "Primero se filtra y después se cuenta.", "esperado": {"filas": 1, "cols": 1, "h": 8268309534834638, "ho": null}}, {"id": "5.3", "enunciado": "¿Cuánto se facturó el 31 de octubre de 2026, el día de Halloween?", "pista": "Sumar una columna, pero solo las filas de ese día.", "esperado": {"filas": 1, "cols": 1, "h": 8625660618306911, "ho": null}}, {"id": "5.4", "enunciado": "¿Cuánto dinero hay en el bote de las propinas? Suma todas las propinas.", "pista": "Hay una función que suma una columna entera.", "esperado": {"filas": 1, "cols": 1, "h": 4695543749221920, "ho": null}}, {"id": "5.5", "enunciado": "¿Cuál es la propina media? Redondéala a 2 decimales.", "pista": "La media se saca con una función, y los decimales se quitan con otra que la envuelve.", "esperado": {"filas": 1, "cols": 1, "h": 7661087164617974, "ho": null}}, {"id": "5.6", "enunciado": "¿Cuántas personas había en el grupo más grande?", "pista": "No hace falta ordenar: hay una función que da el valor más alto.", "esperado": {"filas": 1, "cols": 1, "h": 2515949358551822, "ho": null}}, {"id": "5.7", "enunciado": "¿Cuántos clientes pasaron por el bar en octubre? Suma los comensales de las comandas del 1 al 31 de octubre de 2026.", "pista": "Sumar los comensales de un rango de fechas.", "esperado": {"filas": 1, "cols": 1, "h": 1471833414333619, "ho": null}}, {"id": "5.8", "enunciado": "El dueño duda si seguir aceptando bizum. ¿Cuánto dinero se ha cobrado con bizum en total?", "pista": "¿Qué columna dice cómo se pagó? ¿Y cuál dice cuánto se pagó?", "abierta": true, "titulo": "Pregunta del dueño", "esperado": {"filas": 1, "claves": [7868193119451921]}}]}, {"id": "b6", "pestana": "6. GROUP BY", "titulo": "GROUP BY y HAVING", "intro": "", "docs": [["GROUP BY", "https://www.w3schools.com/sql/sql_groupby.asp"], ["HAVING", "https://www.w3schools.com/sql/sql_having.asp"]], "teoria": "group-by", "ejemplos": [{"id": "6.a", "texto": "Cuántos platos hay en cada categoría.", "sql": "SELECT categoria, COUNT(*) AS num_platos\nFROM carta\nGROUP BY categoria;"}, {"id": "6.b", "texto": "Cuánto factura cada zona del bar.", "sql": "SELECT zona, SUM(total) AS facturacion\nFROM comandas\nGROUP BY zona;"}, {"id": "6.c", "texto": "Cuántas comandas hay de cada forma de pago, de más a menos.", "sql": "SELECT pago, COUNT(*) AS num_comandas\nFROM comandas\nGROUP BY pago\nORDER BY num_comandas DESC;"}, {"id": "6.d", "texto": "Las categorías con más de 5 platos.", "sql": "SELECT categoria, COUNT(*) AS num_platos\nFROM carta\nGROUP BY categoria\nHAVING COUNT(*) > 5;"}], "ejercicios": [{"id": "6.1", "enunciado": "¿Cuántas personas hay en cada puesto? Muestra el puesto y cuántas son.", "pista": "Agrupa por la columna que quieres repartir y cuenta las filas de cada grupo.", "esperado": {"filas": 5, "cols": 2, "h": 1640156683128890, "ho": null}}, {"id": "6.2", "enunciado": "Compara lo que gasta cada mesa en cada zona: muestra cada zona y su ticket medio (la media del total), redondeado a 2 decimales. ¿Dónde se gasta más?", "pista": "Un grupo por zona y, en cada uno, la media del total. Y redondear.", "esperado": {"filas": 3, "cols": 2, "h": 5121231888314974, "ho": null}}, {"id": "6.3", "enunciado": "¿Con qué forma de pago se deja más propina? Muestra cada forma de pago y su propina media, redondeada a 2 decimales.", "pista": "Lo mismo, con otro grupo y otra columna.", "esperado": {"filas": 3, "cols": 2, "h": 8563868135907724, "ho": null}}, {"id": "6.4", "enunciado": "¿Cuáles fueron los 3 días que más se facturó? Muestra la fecha y la facturación, de más a menos.", "pista": "Agrupar y sumar, ordenar por esa suma y quedarse con 3.", "esperado": {"filas": 3, "cols": 2, "h": 8195626927103311, "ho": 5459192760842882}}, {"id": "6.5", "enunciado": "¿Qué 3 camareros han servido más comandas? Muestra el camarero_id y cuántas comandas, de más a menos.", "pista": "Agrupar, contar, ordenar y quedarse con 3.", "esperado": {"filas": 3, "cols": 2, "h": 6791893593011490, "ho": 6791893593011490}}, {"id": "6.6", "enunciado": "¿Qué días se facturó más de 1.400 €? Muestra la fecha y la facturación.", "pista": "Para quedarse con algunos grupos no vale el WHERE.", "esperado": {"filas": 4, "cols": 2, "h": 1677787806032818, "ho": null}}, {"id": "6.7", "enunciado": "En la tabla lineas está cada plato de cada comanda, con su cantidad. ¿Cuáles son los 3 platos que más se venden? Muestra el plato_id y las unidades (la suma de cantidad), de más a menos.", "pista": "La tabla es otra, lineas. Un grupo por plato y, en cada uno, la suma de la cantidad.", "esperado": {"filas": 3, "cols": 2, "h": 6987309204658683, "ho": 5590893582420953}}, {"id": "6.8", "enunciado": "¿Qué día vino más gente al bar, y cuántas personas fueron?", "pista": "Cada comanda puede ser de una persona o de un grupo: lo que hay que sumar son las personas. Después, el día con más.", "abierta": true, "titulo": "Pregunta del dueño", "esperado": {"filas": 1, "claves": [8329363708343667, 6397060880081741]}}]}], "mision": {"id": "mision", "pestana": "Misión", "titulo": "Misión: la caja del sábado", "historia": ["Domingo 8 de noviembre de 2026, diez de la mañana. Te llama Rosa, la encargada del Bar La Consulta: anoche pasó algo raro con la caja, y en el bar nadie sabe SQL.", "Con lo que has aprendido hoy, averigua qué pasó, cuánto dinero falta y quién fue. Cada paso te lleva al siguiente.", "Al final de la misión, debajo del M.11, está el recuadro para acusar. Hay que escribir el nombre y el apellido y cuánto dinero falta. Si te equivocas de persona, te contestará ella."], "pasos": [{"id": "M.1", "titulo": "Lo que pasó", "enunciado": "Empieza por la tabla incidencias. Busca la del sábado 7 de noviembre de 2026 (fecha '2026-11-07') que es de tipo 'caja' y lee la descripción con calma.", "filas": 1, "claves": [6227800686480969], "pista": "Dos condiciones que se cumplen a la vez.", "acusar": false}, {"id": "M.2", "titulo": "El ticket del cliente", "enunciado": "Busca en la tabla comandas la del cliente que llamó: es del sábado 7 de noviembre, de la terraza, se pagó en efectivo y el total fue de 44,70 €.", "filas": 1, "claves": [4716975782058017], "pista": "Cuatro condiciones a la vez. En SQL los decimales van con punto, no con coma.", "acusar": false}, {"id": "M.3", "titulo": "¿Quién anuló ese ticket?", "enunciado": "Busca esa comanda en la tabla anulaciones (la columna comanda_id es el id de la comanda). ¿Quién la anuló, y a qué hora?", "filas": 1, "claves": [1781234494970346, 1484984784041729], "pista": "Una condición sobre la columna comanda_id, con el número que te salió en el M.2.", "acusar": false}, {"id": "M.4", "titulo": "¿Fue solo ese ticket?", "enunciado": "¿Fue solo ese? Quédate con las anulaciones del sábado (fecha '2026-11-07') que se pagaron en efectivo, y suma el importe de cada persona (personal_id). ¿Quién destaca, y cuánto suma? Ese es el dinero que falta.", "filas": 3, "claves": [7298060877653443, 1781234494970346, 6217985172820570, 2337118644721310, 3129294317521344, 4029885287512387], "pista": "Un grupo por persona y, en cada uno, la suma del importe. Los filtros van antes de agrupar.", "acusar": false}, {"id": "M.5", "titulo": "¿Quién es?", "enunciado": "Busca en la tabla personal a quien tiene ese personal_id y fíjate en su turno. ¿Acusas a esa persona?", "filas": 1, "claves": [3000663620777714, 6421854015832931], "pista": "Busca por el id: el número que te ha salido en el M.3 y en el M.4.", "acusar": true}, {"id": "M.6", "titulo": "La coartada", "enunciado": "Mira en fichajes a qué hora entró y salió esa persona el sábado. Usa su personal_id; la entrada empieza por '2026-11-07'.", "filas": 1, "claves": [5017401577297259], "pista": "Dos condiciones: la persona, y que la entrada empiece por esa fecha (como cuando se busca un trozo de texto).", "acusar": false}, {"id": "M.7", "titulo": "¿Era la primera vez?", "enunciado": "Si se fue a las cuatro, alguien usó su código. ¿Había pasado antes? Mira las anulaciones de su código anteriores al sábado (fecha menor que '2026-11-07') y fíjate en la hora, el importe y la forma de pago.", "filas": 4, "claves": [6858936704123185, 6410176782663196, 5714417738410561, 1394520561515305, 3844535896589830, 6188407907406152, 8956801286487481, 7410850333851222, 1505506718269566], "pista": "Dos condiciones: la persona, y una fecha anterior al sábado.", "acusar": false}, {"id": "M.8", "titulo": "La hora del robo", "enunciado": "¿A qué hora se hizo la primera anulación con su código el sábado, y a qué hora la última? Saca las dos en una sola consulta.", "filas": 1, "claves": [1484984784041729, 2137972993195639], "pista": "La primera hora es la más pequeña y la última la más grande. Hay dos funciones del bloque 5 que sacan justo eso, también con fechas, y se pueden pedir las dos en el mismo SELECT.", "acusar": false}, {"id": "M.9", "titulo": "Quién seguía en el bar", "enunciado": "Busca en fichajes a quien estuvo en el bar todo ese rato: entró antes de la primera anulación ('2026-11-07 23:48') y salió después de la última ('2026-11-08 01:12'). Apunta sus personal_id.", "filas": 7, "claves": [6160260086179573, 7298060877653443, 6850631215620371, 8956801286487481, 3844535896589830, 3667584934700975, 6217985172820570], "pista": "Dos condiciones a la vez, una para la entrada y otra para la salida. Las fechas con hora se comparan igual que las fechas.", "acusar": false}, {"id": "M.10", "titulo": "Los testigos", "enunciado": "Busca en la tabla declaraciones las que hablan de la TPV y léelas todas. Una describe a quien estaba en la TPV.", "filas": 4, "claves": [7331770477875966, 3623748850651672, 1255367079109888, 1294162409980503], "pista": "Busca la palabra TPV en cualquier parte del texto.", "acusar": false}, {"id": "M.11", "titulo": "Quién fue", "enunciado": "Junta las pistas en la tabla personal: alguien que estuvo en el bar todo ese rato (los personal_id del M.9), que trabaja en cocina y que empezó a trabajar en septiembre de 2026 o más tarde. Cuando te salga una sola persona, acúsala en el recuadro de aquí abajo.", "filas": 1, "claves": [6852123584940915], "pista": "Tres condiciones a la vez. Para la lista de personal_id del M.9 hay una forma de dar varios valores de golpe.", "acusar": true}]}, "extras": [{"id": "practica", "pestana": "Práctica", "titulo": "Más práctica: preguntas del bar", "intro": "Para quien acabe la misión, o para repasar en casa: más preguntas del bar con todo lo anterior, de más fácil a más difícil. Aquí no hay ejemplos.", "docs": [], "teoria": "que-usar", "ejemplos": [], "ejercicios": [{"id": "P.1", "enunciado": "¿Qué cuesta exactamente 4 €? Muestra solo el plato.", "pista": "Una condición de igualdad sobre el precio.", "esperado": {"filas": 4, "cols": 1, "h": 1180480320444624, "ho": null}}, {"id": "P.2", "enunciado": "¿Cuántas comandas se han servido en la barra?", "pista": "Contar, pero solo las filas de una zona.", "esperado": {"filas": 1, "cols": 1, "h": 4551763309181216, "ho": null}}, {"id": "P.3", "enunciado": "¿Qué bocadillos hay y cuánto cuestan? Muestra el plato y el precio, del más caro al más barato.", "pista": "Filtrar por la categoría y después ordenar.", "esperado": {"filas": 5, "cols": 2, "h": 7334176419448578, "ho": 2792423215773554}}, {"id": "P.4", "enunciado": "¿Cuál fue la comanda más cara de la terraza? Muestra el id, la fecha y el total.", "pista": "Solo la terraza, y después un top de una sola fila.", "esperado": {"filas": 1, "cols": 3, "h": 5124226759104747, "ho": null}}, {"id": "P.5", "enunciado": "El sábado 7 de noviembre por la noche se rompió un rato la máquina de tarjetas. ¿Cuántas comandas se pagaron con tarjeta ese día de las 20:00 en adelante?", "pista": "Tres condiciones a la vez. Las horas también van entre comillas y se comparan como las fechas.", "esperado": {"filas": 1, "cols": 1, "h": 3530421109123893, "ho": null}}, {"id": "P.6", "enunciado": "¿Cuánto se ha cobrado con cada forma de pago? Muestra la forma de pago y el total cobrado.", "pista": "Un grupo por forma de pago y, en cada uno, una suma.", "esperado": {"filas": 3, "cols": 2, "h": 797837044147474, "ho": null}}, {"id": "P.7", "enunciado": "Compara la propina de cada zona: muestra cada zona y su propina media, redondeada a 2 decimales. ¿Dónde se deja más?", "pista": "Un grupo por zona y, en cada uno, una media.", "esperado": {"filas": 3, "cols": 2, "h": 6000378092959945, "ho": null}}, {"id": "P.8", "enunciado": "¿Cuántas comandas sirvió cada persona el sábado 7 de noviembre? Muestra el camarero_id y cuántas.", "pista": "Primero se filtra el día y después se agrupa.", "esperado": {"filas": 9, "cols": 2, "h": 1600949859576011, "ho": null}}, {"id": "P.9", "enunciado": "¿A qué hora entró la primera comanda del día de Halloween, y a qué hora la última? Las dos en la misma consulta.", "pista": "La primera hora es la más pequeña, y la última, la más grande.", "esperado": {"filas": 1, "cols": 2, "h": 1838267263073693, "ho": null}}, {"id": "P.10", "enunciado": "¿Qué mesas de la terraza han tenido más de 30 comandas? Muestra la mesa y cuántas comandas.", "pista": "Hay un filtro antes de agrupar y otro después. ¿Cuál va en cada sitio?", "esperado": {"filas": 4, "cols": 2, "h": 77056045174595, "ho": null}}, {"id": "P.11", "enunciado": "¿Qué categorías de la carta tienen un precio medio de más de 5 €? Muestra la categoría y el precio medio, redondeado a 2 decimales.", "pista": "La condición es sobre la media de cada grupo, no sobre cada plato.", "esperado": {"filas": 2, "cols": 2, "h": 4450211098640237, "ho": null}}, {"id": "P.12", "enunciado": "El dueño quiere premiar a quien más propina ha recibido en efectivo. ¿Quién es (su camarero_id) y cuánto ha recibido?", "pista": "Filtrar, agrupar, sumar, ordenar y quedarse con uno: todo lo anterior en una consulta.", "abierta": true, "esperado": {"filas": 1, "claves": [7298060877653443, 1648262378382422]}}]}, {"id": "extra", "pestana": "NULL y CASE", "titulo": "NULL y CASE", "intro": "", "docs": [["NULL", "https://www.w3schools.com/sql/sql_null_values.asp"], ["CASE", "https://www.w3schools.com/sql/sql_case.asp"]], "teoria": "null", "ejemplos": [{"id": "E.a", "texto": "Los platos con los alérgenos sin revisar.", "sql": "SELECT plato, alergenos\nFROM carta\nWHERE alergenos IS NULL;"}, {"id": "E.b", "texto": "La carta con una columna nueva que dice si el plato es caro.", "sql": "SELECT plato, precio,\n  CASE\n    WHEN precio >= 10 THEN 'cara'\n    ELSE 'normal'\n  END AS gama\nFROM carta;"}, {"id": "E.c", "texto": "Volvemos a NULL: contar filas no es lo mismo que contar datos.", "sql": "SELECT COUNT(*) AS platos, COUNT(alergenos) AS revisados\nFROM carta;"}, {"id": "E.d", "texto": "La carta, con un texto en lugar de la casilla vacía.", "sql": "SELECT plato, COALESCE(alergenos, 'sin revisar') AS alergenos\nFROM carta;"}], "ejercicios": [{"id": "E.1", "enunciado": "¿Qué platos tienen ya los alérgenos revisados? Muestra el plato y los alérgenos.", "pista": "Lo contrario de IS NULL.", "esperado": {"filas": 24, "cols": 2, "h": 7739414514650333, "ho": null}}, {"id": "E.2", "enunciado": "¿Cuántos platos tienen los alérgenos sin revisar?", "pista": "Contar, pero solo las filas que no tienen dato.", "esperado": {"filas": 1, "cols": 1, "h": 1781234494970346, "ho": null}}, {"id": "E.3", "enunciado": "Clasifica la carta. Muestra el plato, el precio y una columna gama que diga 'cara' si cuesta 10 € o más, 'media' si cuesta 5 € o más, y 'barata' en el resto.", "pista": "Un WHEN por cada caso. Se queda con el primero que se cumple, así que el orden importa.", "esperado": {"filas": 30, "cols": 3, "h": 3412544335373684, "ho": null}}, {"id": "E.4", "enunciado": "Clasifica las propinas. Muestra el id, la propina y una columna tipo que diga 'generosa' si es de 5 € o más, 'normal' si es mayor que 0, y 'sin propina' si es 0.", "pista": "Tres casos. Piensa en qué orden hay que comprobarlos.", "esperado": {"filas": 966, "cols": 3, "h": 3119013746066910, "ho": null}}, {"id": "E.5", "enunciado": "¿Cuántos platos hay de cada gama (cara, media y barata)? Muestra la gama y cuántos platos.", "pista": "Se puede agrupar por la columna que crea el CASE, usando el nombre que le das con AS.", "esperado": {"filas": 3, "cols": 2, "h": 6058125579654681, "ho": null}}, {"id": "E.6", "enunciado": "Entra un cliente celíaco. ¿Qué platos le puedes asegurar que no llevan gluten? Muestra el plato y los alérgenos.", "pista": "LIKE se puede negar poniendo NOT delante. Cuando te salga, busca en el resultado algún plato sin revisar.", "esperado": {"filas": 16, "cols": 2, "h": 6958930864264834, "ho": null}}, {"id": "E.7", "enunciado": "¿Cuántos platos sin revisar hay en cada categoría? Muestra la categoría y cuántos.", "pista": "Primero se filtran los que no tienen dato y después se agrupa.", "esperado": {"filas": 5, "cols": 2, "h": 1771722961300197, "ho": null}}, {"id": "E.8", "enunciado": "Para la inspección, saca la carta entera con el plato y los alérgenos. Donde no haya dato tiene que poner PENDIENTE.", "pista": "Hay una función que cambia la casilla vacía por el valor que le digas.", "abierta": true, "esperado": {"filas": 30, "claves": [2144753742160633, 4483773126100236, 3247298425889544, 8786668851656955, 7751224336207809, 6813994555950459, 63995003703097, 1084969498492442, 4522989111035150, 473670174021774, 6724812069396070, 6385572153689543, 1852337072935708, 5177297850903297, 540149556519443]}}]}, {"id": "join", "pestana": "JOIN", "titulo": "Juntar tablas con JOIN", "intro": "", "docs": [["JOIN", "https://www.w3schools.com/sql/sql_join_inner.asp"], ["LEFT JOIN", "https://www.w3schools.com/sql/sql_join_left.asp"], ["AS", "https://www.w3schools.com/sql/sql_alias.asp"]], "teoria": "join", "ejemplos": [{"id": "J.a", "texto": "Cada comanda con el nombre de quien la sirvió.", "sql": "SELECT comandas.id, comandas.total, personal.nombre\nFROM comandas\nJOIN personal ON comandas.camarero_id = personal.id;"}, {"id": "J.b", "texto": "Cuántas comandas ha servido cada camarero, con su nombre.", "sql": "SELECT personal.nombre, COUNT(*) AS num_comandas\nFROM comandas\nJOIN personal ON comandas.camarero_id = personal.id\nGROUP BY personal.nombre\nORDER BY num_comandas DESC;"}, {"id": "J.c", "texto": "Lo mismo, con nombres cortos para las tablas.", "sql": "SELECT p.nombre, COUNT(*) AS num_comandas\nFROM comandas AS c\nJOIN personal AS p ON c.camarero_id = p.id\nGROUP BY p.nombre\nORDER BY num_comandas DESC;"}, {"id": "J.d", "texto": "Los platos de las 5 primeras comandas, con su nombre.", "sql": "SELECT l.comanda_id, ca.plato, l.cantidad\nFROM lineas AS l\nJOIN carta AS ca ON l.plato_id = ca.id\nWHERE l.comanda_id <= 5;"}, {"id": "J.e", "texto": "Una comanda junto a sus líneas: su total se repite en cada fila.", "sql": "SELECT c.id, c.total, l.plato_id, l.cantidad\nFROM comandas AS c\nJOIN lineas AS l ON l.comanda_id = c.id\nWHERE c.id = 2;"}, {"id": "J.f", "texto": "Quién no ha servido nunca una comanda.", "sql": "SELECT p.nombre, p.puesto\nFROM personal AS p\nLEFT JOIN comandas AS c ON c.camarero_id = p.id\nWHERE c.id IS NULL;"}], "ejercicios": [{"id": "J.1", "enunciado": "Vuelve a las anulaciones del sábado 7 de noviembre (fecha '2026-11-07'), pero ahora con nombres. Muestra el id de la anulación, el importe y el nombre del dueño del código con el que se anuló.", "pista": "En anulaciones, ¿qué columna dice con qué código se anuló? Esa es la que se junta con el id de personal.", "esperado": {"filas": 12, "cols": 3, "h": 8816125130522176, "ho": null}}, {"id": "J.2", "enunciado": "¿Quién se ha llevado más propinas? Muestra el nombre de cada camarero y la suma de sus propinas, de más a menos.", "pista": "Juntar comandas y personal, y después agrupar por el nombre.", "esperado": {"filas": 10, "cols": 2, "h": 3273272406563306, "ho": 6452249221592925}}, {"id": "J.3", "enunciado": "¿Cuántas comandas sirvió cada persona el sábado 7 de noviembre? Muestra el nombre y cuántas.", "pista": "Juntar dos tablas, filtrar un día y agrupar. ¿En qué orden van las piezas?", "esperado": {"filas": 9, "cols": 2, "h": 5440958694293553, "ho": null}}, {"id": "J.4", "enunciado": "Repite el M.9 de la misión con nombres: quién estuvo en el bar desde las 23:48 del sábado hasta la 01:12 del domingo. Muestra el nombre, la entrada y la salida.", "pista": "fichajes tiene el personal_id, y el nombre está en personal.", "esperado": {"filas": 7, "cols": 3, "h": 3870516129883321, "ho": null}}, {"id": "J.5", "enunciado": "¿Qué 5 platos se venden más? Muestra el nombre del plato y las unidades vendidas, de más a menos.", "pista": "Las unidades están en lineas, y el nombre del plato, en carta.", "esperado": {"filas": 5, "cols": 2, "h": 6523017076187037, "ho": 5457221047351461}}, {"id": "J.6", "enunciado": "¿Y qué 5 platos dejan más dinero? Muestra el plato y lo facturado con él (la cantidad por el precio, sumado), de más a menos.", "pista": "Dentro del SUM se puede multiplicar una columna de cada tabla.", "esperado": {"filas": 5, "cols": 2, "h": 1364136493922961, "ho": 2699904199300309}}, {"id": "J.7", "enunciado": "¿Qué camarero ha atendido a más gente? Dime su nombre y a cuántas personas.", "pista": "La gente se cuenta con los comensales, no con las comandas.", "abierta": true, "esperado": {"filas": 1, "claves": [5201377092558654, 6871379370409041]}}, {"id": "J.8", "enunciado": "¿Quién de la tabla personal no tiene ninguna anulación con su código? Muestra sus nombres.", "pista": "Buscas a los que no tienen pareja en la otra tabla: hace falta el JOIN que deja todas las filas de la primera.", "abierta": true, "esperado": {"filas": 5, "claves": [7451263137461174, 6852123584940915, 4148449264152535, 1069303903261182, 4127640670947521]}}]}, {"id": "hugo", "pestana": "Hugo", "titulo": "Las consultas de Hugo", "intro": "Hugo Blanco, el nuevo de sala, ha visto un vídeo de SQL y le ha mandado a Rosa estas consultas. Ninguna está bien: unas dan error y otras funcionan, pero dan un resultado equivocado. Están escritas en cada recuadro: ejecútalas, mira qué pasa y arréglalas. Aquí los errores salen como los da la base de datos, en inglés y sin explicación.", "docs": [], "teoria": null, "ejemplos": [], "ejercicios": [{"id": "H.1", "enunciado": "Hugo quería los postres de la carta, con su precio.", "pista": "El mensaje dice qué palabra no entiende. ¿Qué cree SQL que es esa palabra, y qué es en realidad?", "abierta": true, "esperado": {"filas": 4, "claves": [7932942121021705, 4406649712031669, 7200938158890497, 3978750572769426]}, "inicial": "SELECT plato, precio\nFROM carta\nWHERE categoria = postres;"}, {"id": "H.2", "enunciado": "Hugo quería las raciones, de la más cara a la más barata.", "pista": "Ninguna palabra está mal escrita. Las piezas de una consulta, ¿pueden ir en cualquier orden?", "abierta": true, "esperado": {"filas": 7, "claves": [1151376967153562, 6769949943523846, 266913091017434, 896988126492066, 5987973955374223, 1483131337089440, 7262638063282929], "orden": [1151376967153562, 6769949943523846, 266913091017434, 896988126492066, 5987973955374223, 1483131337089440, 7262638063282929]}, "inicial": "SELECT plato, precio\nFROM carta\nORDER BY precio DESC\nWHERE categoria = 'raciones';"}, {"id": "H.3", "enunciado": "Hugo quería los platos que se llaman bocadillo de algo. Dice que no hay ninguno.", "pista": "No da error, pero la tabla sale vacía. Mira en la carta cómo se llaman los bocadillos y piensa qué está buscando exactamente esta consulta.", "abierta": true, "esperado": {"filas": 4, "claves": [1775587999068363, 2184030861682518, 5177534019875088, 2797641010659555]}, "inicial": "SELECT plato, precio\nFROM carta\nWHERE plato LIKE 'bocadillo';"}, {"id": "H.4", "enunciado": "Hugo quería los platos con los alérgenos sin revisar. Dice que ya están todos revisados.", "pista": "Mira la columna alergenos entera: ¿de verdad están todos revisados?", "abierta": true, "esperado": {"filas": 6, "claves": [1926663533069351, 6769949943523846, 7262638063282929, 2797641010659555, 3978750572769426, 5873144846854952]}, "inicial": "SELECT plato\nFROM carta\nWHERE alergenos = NULL;"}, {"id": "H.5", "enunciado": "Hugo quería lo cobrado con cada forma de pago. Dice que en el bar todo se paga en efectivo.", "pista": "Hay tres formas de pago: ¿cuántas filas deberían salir? Compara el número que le sale a Hugo con todo lo facturado en el bar.", "abierta": true, "esperado": {"filas": 3, "claves": [3554111845211140, 7898694240367539, 1505506718269566, 7868193119451921, 1337340890976679, 6423449691942773]}, "inicial": "SELECT pago, SUM(total) AS cobrado\nFROM comandas;"}, {"id": "H.6", "enunciado": "Hugo quería la gente de sala y de barra que trabaja de noche. Le salen dos personas del turno de mañana.", "pista": "Mira quién se cuela del turno de mañana y qué puesto tiene. ¿Por qué pasa el filtro?", "abierta": true, "esperado": {"filas": 5, "claves": [4262501684668327, 6320715511233956, 6720534868738354, 8281747806559383, 1140492044707901]}, "inicial": "SELECT nombre, puesto, turno\nFROM personal\nWHERE puesto = 'sala' OR puesto = 'barra' AND turno = 'noche';"}, {"id": "H.7", "enunciado": "Hugo quería las zonas del bar con más de 300 comandas.", "pista": "Cuando SQL llega a esa condición todavía está mirando las comandas de una en una. ¿Se puede saber ahí cuántas hay en cada zona?", "abierta": true, "esperado": {"filas": 1, "claves": [6892504915371912]}, "inicial": "SELECT zona, COUNT(*) AS num_comandas\nFROM comandas\nWHERE COUNT(*) > 300\nGROUP BY zona;"}, {"id": "H.8", "enunciado": "Hugo quería las comandas del sábado 7 de noviembre con el nombre de quien las sirvió. Le salen 750 y ese día hubo 50.", "pista": "750 es 50 × 15. ¿De dónde sale ese 15?", "abierta": true, "esperado": {"filas": 50, "claves": [6554130729086184, 2750123583673304, 7536089619532335, 5040072943305601, 82483278629581, 6050882874514277, 7835153493661269, 1104918356043384, 2262685676243155, 440283464173982, 5031617810954445, 2279410388331026, 6126229344477559, 1033177789058947, 3803205112183921, 1691542764903036, 4309064912002445, 6080138696528151, 3051969840638186, 6063418450232470, 8406717854985924, 8561444830862082, 3106267887450438, 4716975782058017, 3348566543418932, 4254625358041021, 3812817440245701, 4478791147441323, 4701738962411996, 8368182704330580, 1536309302995599, 2934486685468709, 1509375617746237, 1924543034837511, 4620586917068406, 8444243658267694, 4993682362713925, 4740706727400325, 6070961954548283, 2407355160547071, 347632310544541, 4176537630808057, 8064702971428262, 3533441940429521, 8087798647776937, 919709131701871, 5679783194036640, 8944353593049783, 5625057644146204, 5584533289152448, 3801944920407424, 5201377092558654, 3000663620777714, 6720534868738354, 5755733449396897, 4262501684668327, 8281747806559383, 6320715511233956, 1140492044707901]}, "inicial": "SELECT comandas.id, comandas.total, personal.nombre\nFROM comandas\nJOIN personal\nWHERE comandas.fecha = '2026-11-07';"}, {"id": "H.9", "enunciado": "Hugo quería las 5 comandas más caras con el nombre de quien las sirvió. Dice que una la sirvió Pedro, el cocinero.", "pista": "Mira qué id tiene Pedro en la tabla personal y qué id tiene la comanda en la que sale. ¿Casualidad?", "abierta": true, "esperado": {"filas": 5, "claves": [5258976036354238, 7896485787016398, 2350584811101172, 6861230890086890, 673625411588126, 4262501684668327, 1140492044707901, 8281747806559383, 3000663620777714]}, "inicial": "SELECT c.id, c.total, p.nombre\nFROM comandas AS c\nJOIN personal AS p ON c.id = p.id\nORDER BY c.total DESC\nLIMIT 5;"}, {"id": "H.10", "enunciado": "Hugo quería saber cuánto se facturó el día de Halloween (fecha '2026-10-31'). Le salen más de 22.000 € y le ha dicho a Rosa que es el mejor día de la historia del bar.", "pista": "Cambia un momento el SUM por c.id y c.total, y mira cuántas veces sale cada comanda.", "abierta": true, "esperado": {"filas": 1, "claves": [8625660618306911]}, "inicial": "SELECT SUM(c.total) AS facturado\nFROM comandas AS c\nJOIN lineas AS l ON l.comanda_id = c.id\nWHERE c.fecha = '2026-10-31';"}]}, {"id": "fechas", "pestana": "Fechas", "titulo": "¿Cuándo se vende? Fechas y horas", "intro": "Rosa siempre pregunta lo mismo: cuánto por día, por semana o a qué hora. En esta base de datos las fechas son textos con la forma año-mes-día, y strftime saca de ellas el trozo que haga falta.", "docs": [["strftime", "https://www.sqlite.org/lang_datefunc.html"]], "teoria": "fechas", "ejemplos": [{"id": "F.a", "texto": "Lo facturado cada día, por orden de fecha.", "sql": "SELECT fecha, COUNT(*) AS num_comandas, SUM(total) AS facturado\nFROM comandas\nGROUP BY fecha\nORDER BY fecha;"}, {"id": "F.b", "texto": "Lo mismo, por día de la semana.", "sql": "SELECT strftime('%w', fecha) AS dia_semana, COUNT(*) AS num_comandas, SUM(total) AS facturado\nFROM comandas\nGROUP BY dia_semana;"}, {"id": "F.c", "texto": "Cuántas comandas se sirven a cada hora.", "sql": "SELECT strftime('%H', hora) AS h, COUNT(*) AS num_comandas\nFROM comandas\nGROUP BY h;"}], "ejercicios": [{"id": "F.1", "enunciado": "¿Cuánto se facturó en octubre y cuánto en lo que va de noviembre? En una sola consulta, con una fila por mes.", "pista": "Hay que agrupar por un trozo de la fecha que no es el día de la semana.", "abierta": true, "esperado": {"filas": 2, "claves": [3885234301156207, 6069044447330259]}}, {"id": "F.2", "enunciado": "¿Cuáles han sido los 3 días con más facturación? Con la fecha y lo facturado.", "pista": "Una fila por día, y después un top.", "abierta": true, "esperado": {"filas": 3, "claves": [8329363708343667, 5906483404346673, 7240889629824327, 8625660618306911, 3582535628253428, 3008412947553039]}}, {"id": "F.3", "enunciado": "¿Qué día de la semana se factura más? Muestra lo facturado cada día de la semana, del mejor al peor.", "pista": "Acuérdate de qué número es cada día: el 0 es el domingo.", "abierta": true, "esperado": {"filas": 6, "claves": [3239713444623292, 3750318800386679, 5347921480593504, 2802903289783547, 2658368834488146, 1105055560447667]}}, {"id": "F.4", "enunciado": "Los domingos, ¿cuántas comandas se sirven a cada hora? Mira bien las horas que salen.", "pista": "Se puede usar strftime también en el WHERE. Lo que devuelve es un texto.", "abierta": true, "esperado": {"filas": 3, "claves": [8317545983350498, 334667354427021]}}, {"id": "F.5", "enunciado": "Los sábados por la noche (de las 20:00 en adelante), ¿cuántas comandas sirve cada zona del bar?", "pista": "Dos condiciones, una sobre la fecha y otra sobre la hora. Las horas son textos y se comparan como las fechas.", "abierta": true, "esperado": {"filas": 3, "claves": [8317545983350498, 5648897457246678, 532412220745119]}}, {"id": "F.6", "enunciado": "Rosa dice que comparar lo facturado por día de la semana es injusto, porque en estos datos hay 6 jueves y solo 5 miércoles. Saca, para cada día de la semana, lo que se factura de media en un día de esos, redondeado a 2 decimales.", "pista": "AVG(total) da la media por comanda, y aquí se pide por día. Hace falta saber cuántos días distintos hay en cada grupo.", "abierta": true, "esperado": {"filas": 6, "claves": [6787814838566817, 5119412653013862, 8155047689339374, 5516736229088450, 3463218291791618, 3998126394093312]}}, {"id": "F.7", "enunciado": "¿Cuánto se ha facturado cada semana, contando las semanas de lunes a domingo? Hay una semana que destaca, y otra que parece muy mala y no lo es: averigua por qué.", "pista": "El número de la semana se saca con otra letra. Para entender cada semana, enseña también su primer y su último día.", "abierta": true, "esperado": {"filas": 6, "claves": [7704344075652001, 844193212013034, 1994079599615521, 8003402993287575, 8018247051409639, 5758709642182827]}}]}, {"id": "sub", "pestana": "Subconsultas", "titulo": "Comparar con la media: subconsultas y porcentajes", "intro": "Para saber si un número es mucho o poco se compara con la media, con el máximo o con el total. Para eso se mete una consulta dentro de otra, entre paréntesis.", "docs": [["Subconsultas", "https://www.sqlitetutorial.net/sqlite-subquery/"]], "teoria": "subconsultas", "ejemplos": [{"id": "S.a", "texto": "Los platos que cuestan más que la media de la carta.", "sql": "SELECT plato, precio\nFROM carta\nWHERE precio > (SELECT AVG(precio) FROM carta);"}, {"id": "S.b", "texto": "La comanda más cara, con todos sus datos.", "sql": "SELECT *\nFROM comandas\nWHERE total = (SELECT MAX(total) FROM comandas);"}, {"id": "S.c", "texto": "Qué porcentaje de las comandas se paga con cada forma de pago.", "sql": "SELECT pago, COUNT(*) AS num_comandas,\n  ROUND(100.0 * COUNT(*) / (SELECT COUNT(*) FROM comandas), 1) AS porcentaje\nFROM comandas\nGROUP BY pago;"}], "ejercicios": [{"id": "S.1", "enunciado": "¿Cuántas comandas tienen un total por encima del total medio de una comanda?", "pista": "La media se calcula dentro de un paréntesis y se compara con cada comanda.", "abierta": true, "esperado": {"filas": 1, "claves": [8653519177245094]}}, {"id": "S.2", "enunciado": "¿Cuál es el plato más barato de la carta? Con su precio, y sin usar LIMIT.", "pista": "Primero el precio más bajo, y después el plato que tiene ese precio.", "abierta": true, "esperado": {"filas": 1, "claves": [227977639079116]}}, {"id": "S.3", "enunciado": "¿Quién sirvió la comanda con la propina más alta? Con su nombre y la propina.", "pista": "La propina más alta se busca en comandas. El nombre está en otra tabla.", "abierta": true, "esperado": {"filas": 1, "claves": [4262501684668327, 8939664687919420]}}, {"id": "S.4", "enunciado": "¿Qué porcentaje de lo facturado viene de cada zona del bar? Redondeado a 1 decimal.", "pista": "La parte es lo que suma cada zona. El total es lo que suman todas las comandas.", "abierta": true, "esperado": {"filas": 3, "claves": [1419956695124408, 7002367402988780, 6397774793868660]}}, {"id": "S.5", "enunciado": "¿Quién de la plantilla no ha servido nunca una comanda? Esta vez, sin LEFT JOIN.", "pista": "Una consulta entre paréntesis también puede dar una lista entera de valores, no solo un número.", "abierta": true, "esperado": {"filas": 5, "claves": [7451263137461174, 6852123584940915, 4148449264152535, 1069303903261182, 4127640670947521]}}, {"id": "S.6", "enunciado": "¿En qué porcentaje de las comandas no se deja nada de propina? Redondeado a 1 decimal.", "pista": "El filtro va en la consulta de fuera. La de dentro tiene que seguir contando todas.", "abierta": true, "esperado": {"filas": 1, "claves": [4455074178109381]}}, {"id": "S.7", "enunciado": "¿Qué días se facturó más que en un día medio? Con la fecha y lo facturado, de más a menos.", "pista": "Lo que factura un día medio es todo lo facturado entre el número de días. Y la condición es sobre cada grupo, no sobre cada comanda.", "abierta": true, "esperado": {"filas": 12, "claves": [8329363708343667, 5906483404346673, 7240889629824327, 4565473482397706, 151889133435339, 2555963163921293, 7686227050524773, 3920183640087968, 5980820079148215, 8374379994548357, 6314205564752595, 8292539085756932]}}]}, {"id": "informe", "pestana": "Informe", "titulo": "El informe de Rosa", "intro": "Después del susto del sábado, Rosa quiere saber cómo va el bar y te ha dejado catorce preguntas. No dicen qué piezas usar ni qué columnas enseñar: lo decides tú. Al acabar, piensa qué le recomendarías a Rosa con lo que has visto.", "docs": [], "teoria": "que-usar", "ejemplos": [], "ejercicios": [{"id": "I.1", "enunciado": "Para empezar el informe: ¿cuánto ha facturado el bar desde el 1 de octubre, y en cuántas comandas?", "pista": "Dos cuentas en la misma consulta, separadas por una coma.", "abierta": true, "esperado": {"filas": 1, "claves": [7332601944697403, 5584533289152448]}}, {"id": "I.2", "enunciado": "¿Quiénes son las 3 personas que más comandas han servido? Con su nombre.", "pista": "El nombre está en otra tabla. Después, contar por persona y quedarse con las primeras.", "abierta": true, "esperado": {"filas": 3, "claves": [5201377092558654, 3000663620777714, 6320715511233956, 7046446615400454, 7191139265380149, 1592467724430538]}}, {"id": "I.3", "enunciado": "¿Con quién gasta más cada mesa? Saca el ticket medio de cada persona que sirve, redondeado a 2 decimales.", "pista": "El total está en una tabla y el nombre en otra.", "abierta": true, "esperado": {"filas": 10, "claves": [8281747806559383, 4262501684668327, 6720534868738354, 3000663620777714, 5201377092558654, 1140492044707901, 5755733449396897, 6801368537676275, 3801944920407424, 6320715511233956, 88584788562883, 1821309314236517, 2555775204316750, 3582837624698767, 3890590771704467, 6526076502437975, 5844200510957762, 6993311485544444, 3489584788747942, 198833383540381]}}, {"id": "I.4", "enunciado": "¿Cuáles son las 3 tapas que más se piden? Con su nombre y las unidades.", "pista": "Mira en qué tabla está cada cosa que necesitas: las unidades, el nombre y la categoría.", "abierta": true, "esperado": {"filas": 3, "claves": [5706977646674869, 8488902398208359, 8816667807056288, 1434650326399474, 8430409600542211, 2377871399515965]}}, {"id": "I.5", "enunciado": "¿Cuánto dinero deja cada categoría de la carta (tapas, raciones, bebidas...)?", "pista": "El total de la comanda no sirve aquí: no sabe de categorías. Hay que calcular el dinero línea a línea.", "abierta": true, "esperado": {"filas": 5, "claves": [8602046982077018, 4905273636446850, 3946531523271498, 4638942064193281, 2791321940901747, 7210485081844467, 7727787332615497, 6541336163540075, 3638339836926454, 6407856386957374]}}, {"id": "I.6", "enunciado": "Sanidad vuelve la semana que viene. De los platos con los alérgenos sin revisar, ¿cuántas unidades se han vendido de cada uno? Rosa quiere empezar por el que más se vende.", "pista": "Primero, quedarse con los platos que no tienen el dato. Después, sumar unidades por plato.", "abierta": true, "esperado": {"filas": 6, "claves": [5873144846854952, 1926663533069351, 3978750572769426, 6769949943523846, 7262638063282929, 2797641010659555, 621630163464462, 3431871245301876, 6302054634970236, 8211848196912607, 6198393021489546, 7708217789574339]}}, {"id": "I.7", "enunciado": "¿Quién ha servido más de 150 comandas? Con su nombre y cuántas.", "pista": "La condición es sobre lo que se cuenta en cada grupo.", "abierta": true, "esperado": {"filas": 2, "claves": [5201377092558654, 3000663620777714, 7046446615400454, 7191139265380149]}}, {"id": "I.8", "enunciado": "¿Se deja más propina a la gente del turno de mañana o a la de noche? Saca la propina media de cada turno, redondeada a 2 decimales.", "pista": "¿En qué tabla pone el turno de cada persona?", "abierta": true, "esperado": {"filas": 2, "claves": [6421854015832931, 1886557197407052, 3353138026816388, 3299087362845075]}}, {"id": "I.11", "enunciado": "Rosa quiere reforzar la terraza un día a la semana. ¿Qué día de la semana se sirven más comandas en la terraza? Muestra solo ese día y cuántas comandas.", "pista": "El día de la semana no es una columna: hay que sacarlo de la fecha.", "abierta": true, "esperado": {"filas": 1, "claves": [5884865769262631]}}, {"id": "I.12", "enunciado": "Rosa cree que el bar depende demasiado del fin de semana. ¿Qué porcentaje de todo lo facturado se hace entre viernes y sábado? Redondeado a 1 decimal.", "pista": "La parte son las comandas de dos días de la semana. El total, todas.", "abierta": true, "esperado": {"filas": 1, "claves": [911685710185929]}}, {"id": "I.13", "enunciado": "El proveedor de quesos ha subido los precios. ¿Cuántas unidades se han vendido de cada plato que lleva queso en el nombre?", "pista": "El nombre del plato está en una tabla y las unidades en otra. Y no buscas un nombre exacto, sino un trozo.", "abierta": true, "esperado": {"filas": 3, "claves": [5177534019875088, 5987973955374223, 7932942121021705, 152738790188121, 7259135593134502, 2275039332526555]}}, {"id": "I.14", "enunciado": "¿Quién se lleva las mesas grandes? Cuenta cuántas comandas con un total por encima del total medio ha servido cada persona. Solo quien tenga alguna.", "pista": "Primero te quedas con las comandas que superan la media, y después las repartes por persona.", "abierta": true, "esperado": {"filas": 8, "claves": [5201377092558654, 3000663620777714, 4262501684668327, 6720534868738354, 8281747806559383, 1140492044707901, 6801368537676275, 5755733449396897, 592134176656854, 6432879068373887, 3652642405936424, 3168771439154299, 8148604641943893, 7873209753776785, 6071989036780395, 3530421109123893]}}, {"id": "I.9", "enunciado": "Rosa quiere la lista de todo el personal, las 15 personas, con cuántas comandas ha servido cada una. Quien no ha servido ninguna tiene que salir con un 0.", "pista": "Hace falta el JOIN que no pierde a nadie de la primera tabla. Y cuidado con qué cuentas: quien no ha servido nada también tiene su fila.", "abierta": true, "esperado": {"filas": 15, "claves": [5201377092558654, 3000663620777714, 6320715511233956, 3801944920407424, 4262501684668327, 6720534868738354, 8281747806559383, 1140492044707901, 6801368537676275, 5755733449396897, 4148449264152535, 4127640670947521, 7451263137461174, 1069303903261182, 6852123584940915, 7046446615400454, 7191139265380149, 1592467724430538, 982769068913880, 2921229657371888, 1672738577093409, 4403547337806524, 2835686856054784, 5643866685327481, 7544131463920937, 4700689441252603]}}, {"id": "I.10", "enunciado": "Y para cerrar el caso: ¿cuánto dinero se ha anulado con el código de cada persona desde el 1 de octubre? Con su nombre, de más a menos.", "pista": "En anulaciones solo hay números de persona. Fíjate en cómo se llama la columna que hay que juntar.", "abierta": true, "esperado": {"filas": 10, "claves": [3000663620777714, 6720534868738354, 5201377092558654, 5755733449396897, 4262501684668327, 8281747806559383, 6320715511233956, 3801944920407424, 1140492044707901, 6801368537676275, 8778402061230627, 532412220745119, 222134716146051, 2788805516145706, 3530421109123893, 6589291798200526, 3370816025549632, 120595744559035, 6334555661287167, 6188407907406152]}}]}, {"id": "retos", "pestana": "Retos", "titulo": "Retos: más de dos tablas a la vez", "intro": "Para quien haya acabado el informe. Hasta ahora has juntado dos tablas. Se pueden juntar más: cada tabla nueva, con su JOIN y su ON, uno debajo de otro.", "docs": [["JOIN", "https://www.w3schools.com/sql/sql_join.asp"]], "teoria": "join", "ejemplos": [{"id": "R.a", "texto": "Lo que pidió la comanda 2, con el nombre de quien la sirvió y el de cada plato.", "sql": "SELECT c.id, p.nombre, ca.plato, l.cantidad\nFROM comandas AS c\nJOIN personal AS p ON c.camarero_id = p.id\nJOIN lineas AS l ON l.comanda_id = c.id\nJOIN carta AS ca ON l.plato_id = ca.id\nWHERE c.id = 2;"}], "ejercicios": [{"id": "R.1", "enunciado": "El ticket del cliente que llamó el domingo era la comanda 940. ¿Qué pidió esa mesa? Con el nombre de cada plato y la cantidad.", "pista": "Lo que se pidió y cómo se llama cada plato están en dos tablas distintas.", "abierta": true, "esperado": {"filas": 8, "claves": [5706977646674869, 7884539618268357, 6769949943523846, 7932942121021705, 3978750572769426, 7406297653190737, 1848907058165151, 3535960098594461]}}, {"id": "R.2", "enunciado": "¿Qué ración se pide más en la terraza? Con su nombre y las unidades.", "pista": "Busca en el panel dónde están la zona, las unidades y la categoría. No están en la misma tabla.", "abierta": true, "esperado": {"filas": 1, "claves": [5987973955374223, 435957250536220]}}, {"id": "R.3", "enunciado": "El jamón ibérico es lo más caro de la carta. ¿Quién ha vendido más? Con su nombre y las unidades.", "pista": "De la persona al plato hay que pasar por comandas y por lineas.", "abierta": true, "esperado": {"filas": 1, "claves": [5201377092558654, 6719564826741728]}}, {"id": "R.4", "enunciado": "¿Cuánto dinero dejan las bebidas en cada zona del bar?", "pista": "El dinero de las bebidas hay que calcularlo línea a línea. La zona está en otra tabla.", "abierta": true, "esperado": {"filas": 3, "claves": [8592871946591006, 6892504915371912, 954134126997622, 8527016025853365, 5846356620930998, 326514013192225]}}, {"id": "R.5", "enunciado": "¿Cuáles fueron las 3 cosas más pedidas el día de Halloween (fecha '2026-10-31')? Con su nombre y las unidades.", "pista": "La fecha está en comandas, no en lineas.", "abierta": true, "esperado": {"filas": 3, "claves": [7406297653190737, 4137444378703928, 227977639079116, 3954530707122054, 2730259449767184, 4374508316193192]}}, {"id": "R.6", "enunciado": "El 17 de octubre llegaron 40 kilos de patatas en vez de 4. ¿Cuántas patatas bravas se vendieron cada día de esa semana, del 17 al 23 de octubre?", "pista": "Dos condiciones, cada una sobre una tabla distinta, y un grupo por día.", "abierta": true, "esperado": {"filas": 6, "claves": [151889133435339, 7197705797857103, 2638008879860309, 7853641434906307, 274575192152136, 5980820079148215, 1781234494970346, 7298060877653443, 8956801286487481, 3844535896589830, 5753662387798126]}}, {"id": "R.7", "enunciado": "Los domingos solo se dan comidas. Sin contar las bebidas, ¿cuáles son las 3 cosas que más se piden los domingos? Con su nombre y las unidades.", "pista": "El día está en una tabla, la categoría en otra y las unidades en la del medio.", "abierta": true, "esperado": {"filas": 3, "claves": [4406649712031669, 7200938158890497, 5706977646674869, 5024116308656090, 2419625841103218, 8202081074167585]}}, {"id": "R.8", "enunciado": "¿Qué se pide más en las comidas y qué en las cenas? Llama 'comida' a lo que se sirve antes de las 17:00 y 'cena' al resto, y saca las unidades vendidas de cada categoría de la carta en cada servicio. Muestra la categoría, el servicio y las unidades. Hace falta CASE, que está en la pestaña NULL y CASE.", "pista": "La columna del servicio no existe: hay que crearla a partir de la hora. Después se agrupa por dos columnas a la vez.", "esperado": {"filas": 10, "cols": 3, "h": 7749646291943026, "ho": null}}]}, {"id": "dml", "pestana": "Cambiar datos", "titulo": "Cambiar datos: INSERT, UPDATE y DELETE", "intro": "Hasta ahora solo has mirado datos. Aquí se cambian: se añaden filas, se modifican y se borran. Se practica con la tabla reservas, que tiene las de la semana que viene. Si estropeas algo, pulsa Restaurar la base de datos y todo vuelve a estar como al principio.", "docs": [["INSERT", "https://www.w3schools.com/sql/sql_insert.asp"], ["UPDATE", "https://www.w3schools.com/sql/sql_update.asp"], ["DELETE", "https://www.w3schools.com/sql/sql_delete.asp"], ["CREATE TABLE", "https://www.w3schools.com/sql/sql_create_table.asp"]], "teoria": "cambiar-datos", "ejemplos": [{"id": "D.a", "texto": "Apuntar una reserva nueva.", "sql": "INSERT INTO reservas (fecha, hora, nombre, personas, zona, telefono)\nVALUES ('2026-11-15', '14:00', 'Luis Marín', 3, 'salon', '600888999');\n\nSELECT * FROM reservas;"}, {"id": "D.b", "texto": "Cambiar una reserva: Tomás y Clara al final son 3.", "sql": "UPDATE reservas\nSET personas = 3\nWHERE id = 10;\n\nSELECT * FROM reservas;"}, {"id": "D.c", "texto": "El mismo UPDATE, sin WHERE.", "sql": "UPDATE reservas\nSET zona = 'terraza';\n\nSELECT * FROM reservas;"}, {"id": "D.d", "texto": "Borrar una reserva: Irene Sola cancela.", "sql": "DELETE FROM reservas\nWHERE id = 11;\n\nSELECT * FROM reservas;"}, {"id": "D.e", "texto": "Crear una tabla nueva y meterle dos filas.", "sql": "CREATE TABLE proveedores (\n  id INTEGER PRIMARY KEY,\n  nombre TEXT NOT NULL,\n  telefono

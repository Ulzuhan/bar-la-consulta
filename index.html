<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar La Consulta · SQL</title>
<meta name="description" content="Laboratorio de SQL del Bar La Consulta: SQLite en el navegador, con ejercicios que se corrigen solos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap" rel="stylesheet">
<style>
:root {
  --fondo: #f7f2e9;
  --superficie: #fffdf8;
  --superficie-2: #f1ebdf;
  --borde: #ddd3c2;
  --tinta: #2a2521;
  --tinta-suave: #6b6158;
  --pizarra: #23392e;
  --pizarra-tinta: #f4ecdc;
  --acento: #b5492a;
  --acento-suave: #f6e1d8;
  --ok: #2f7a4b;
  --ok-suave: #e1f1e6;
  --mal: #a8322a;
  --mal-suave: #f8e2df;
  --aviso: #8a5a00;
  --aviso-suave: #fbefd3;
  --codigo-fondo: #fffefa;
  --nulo: #9b8f84;
  --sombra: 0 1px 2px rgba(42, 37, 33, .08), 0 2px 8px rgba(42, 37, 33, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #191816;
    --superficie: #23211e;
    --superficie-2: #2c2a26;
    --borde: #3d3934;
    --tinta: #ece5d8;
    --tinta-suave: #a99f92;
    --pizarra: #1e3328;
    --pizarra-tinta: #efe6d4;
    --acento: #e2805f;
    --acento-suave: #3d2a22;
    --ok: #74c293;
    --ok-suave: #1f3428;
    --mal: #f08b80;
    --mal-suave: #3c2422;
    --aviso: #e8b65a;
    --aviso-suave: #3a2f1a;
    --codigo-fondo: #1d1c19;
    --nulo: #847a6f;
    --sombra: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #191816; --superficie: #23211e; --superficie-2: #2c2a26; --borde: #3d3934;
  --tinta: #ece5d8; --tinta-suave: #a99f92; --pizarra: #1e3328; --pizarra-tinta: #efe6d4;
  --acento: #e2805f; --acento-suave: #3d2a22; --ok: #74c293; --ok-suave: #1f3428;
  --mal: #f08b80; --mal-suave: #3c2422; --aviso: #e8b65a; --aviso-suave: #3a2f1a;
  --codigo-fondo: #1d1c19; --nulo: #847a6f; --sombra: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--fondo);
  color: var(--tinta);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
code, textarea, .tabla-res, .col-nombre, .tabla-nombre {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
a { color: var(--acento); }
button { font: inherit; cursor: pointer; }

/* cabecera */
.cabecera {
  background: var(--pizarra);
  color: var(--pizarra-tinta);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 10px 20px;
  flex-wrap: wrap;
}
.marca { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.rotulo { font-family: "Bree Serif", Georgia, serif; font-size: 26px; letter-spacing: .5px; }
.lema { font-size: 14px; opacity: .8; }
.acciones { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.estado-bd { opacity: .85; }
.btn-claro {
  background: transparent; color: var(--pizarra-tinta);
  border: 1px solid rgba(244, 236, 220, .45); border-radius: 6px; padding: 5px 10px; font-size: 14px;
}
.btn-claro:hover { background: rgba(244, 236, 220, .12); }

/* pestañas */
.pestanas {
  position: sticky; top: 0; z-index: 5;
  background: var(--superficie);
  border-bottom: 1px solid var(--borde);
  display: flex; gap: 2px; overflow-x: auto;
  padding: 0 12px;
}
.pestana {
  background: none; border: none; border-bottom: 3px solid transparent;
  padding: 11px 12px 9px; color: var(--tinta-suave); white-space: nowrap; font-size: 15px;
}
.pestana:hover { color: var(--tinta); }
.pestana[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--acento); font-weight: 600; }
.progreso { font-size: 12px; margin-left: 6px; padding: 1px 6px; border-radius: 10px; background: var(--superficie-2); color: var(--tinta-suave); font-weight: 500; }
.progreso.completo { background: var(--ok-suave); color: var(--ok); }
.progreso:empty { display: none; }

/* cuerpo */
.cuerpo { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0; align-items: start; }
.panel {
  position: sticky; top: 46px; max-height: calc(100vh - 46px); overflow-y: auto;
  border-right: 1px solid var(--borde); padding: 16px 12px 40px; font-size: 14px;
}
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta-suave); margin: 4px 6px 8px; font-weight: 600; }
.panel h2.segundo { margin-top: 18px; }
.panel .ayuda { color: var(--tinta-suave); font-size: 12.5px; margin: 0 6px 10px; }
.tabla { margin-bottom: 2px; }
.tabla summary { list-style: none; cursor: pointer; padding: 4px 6px; border-radius: 6px; display: flex; justify-content: space-between; gap: 6px; }
.tabla summary::-webkit-details-marker { display: none; }
.tabla summary:hover { background: var(--superficie-2); }
.tabla summary::before { content: "▸"; color: var(--tinta-suave); margin-right: 4px; }
.tabla[open] summary::before { content: "▾"; }
.tabla-nombre { font-weight: 600; flex: 1; background: none; border: none; text-align: left; padding: 0; color: var(--tinta); font-size: 14px; }
.tabla-nombre:hover, .col-nombre:hover { color: var(--acento); }
.tabla-filas { color: var(--tinta-suave); font-size: 12px; }
.columnas { list-style: none; margin: 2px 0 8px 22px; padding: 0; }
.columnas li { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
.col-nombre { background: none; border: none; padding: 0; color: var(--tinta); font-size: 13.5px; text-align: left; }
.col-tipo { color: var(--tinta-suave); font-size: 12px; }

main { padding: 22px 28px 80px; max-width: 1000px; width: 100%; }
.bloque { display: none; }
.bloque.activo { display: block; }
.bloque > h1 { font-family: "Bree Serif", Georgia, serif; font-weight: 400; font-size: 28px; margin: 0 0 6px; }
.intro { color: var(--tinta-suave); margin: 0 0 6px; max-width: 70ch; }
.docs { font-size: 14px; color: var(--tinta-suave); margin: 0 0 18px; }
.docs a { margin-right: 10px; }
.seccion { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--tinta-suave); margin: 26px 0 10px; font-weight: 600; }

/* tarjetas */
.tarjeta {
  background: var(--superficie); border: 1px solid var(--borde); border-radius: 10px;
  padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--sombra);
}
.tarjeta.resuelto { border-color: var(--ok); }
.cab-tarjeta { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
.num { font-weight: 700; color: var(--acento); font-variant-numeric: tabular-nums; }
.titulo-paso { font-weight: 600; }
.marca-ok { margin-left: auto; color: var(--ok); font-weight: 600; font-size: 14px; }
.enunciado { margin: 0 0 4px; max-width: 75ch; }
.esperado { font-size: 14px; color: var(--tinta-suave); margin: 0 0 8px; }
.btn-pista { background: none; border: none; color: var(--acento); padding: 0; font-size: 14px; text-decoration: underline; text-underline-offset: 2px; }
.pista { font-size: 14px; color: var(--tinta-suave); margin: 0 0 8px; }

/* editor */
.editor { margin-top: 8px; }
textarea {
  width: 100%; min-height: 64px; resize: vertical;
  background: var(--codigo-fondo); color: var(--tinta);
  border: 1px solid var(--borde); border-radius: 8px;
  padding: 10px 12px; font-size: 16px; line-height: 1.5; tab-size: 2;
}
textarea:focus { outline: 2px solid var(--acento); outline-offset: 0; border-color: transparent; }
.barra-editor { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.btn-ejecutar {
  background: var(--acento); color: #fff; border: none; border-radius: 7px;
  padding: 7px 16px; font-weight: 600; font-size: 15px;
}
.btn-ejecutar:hover { filter: brightness(1.08); }
.btn-ejecutar:disabled { opacity: .5; cursor: wait; }
.atajo { font-size: 13px; color: var(--tinta-suave); }

/* resultados */
.resultado { margin-top: 10px; }
.resumen { font-size: 14px; color: var(--tinta-suave); margin-bottom: 6px; }
.envoltura-tabla { overflow: auto; max-height: 360px; border: 1px solid var(--borde); border-radius: 8px; }
.tabla-res { border-collapse: collapse; font-size: 14px; width: max-content; min-width: 100%; }
.tabla-res th, .tabla-res td { padding: 5px 12px; border-bottom: 1px solid var(--borde); text-align: left; white-space: nowrap; }
.tabla-res td.texto-largo { white-space: normal; min-width: 320px; max-width: 640px; }
.tabla-res th { position: sticky; top: 0; background: var(--superficie-2); font-weight: 600; }
.tabla-res td.numero { text-align: right; font-variant-numeric: tabular-nums; }
.tabla-res td.nulo { color: var(--nulo); font-style: italic; }
.tabla-res tr:last-child td { border-bottom: none; }
.aviso { border-radius: 8px; padding: 9px 12px; font-size: 15px; margin-top: 10px; }
.aviso.error { background: var(--mal-suave); color: var(--mal); }
.aviso.error .original { display: block; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; opacity: .8; margin-top: 4px; }
.aviso.ok { background: var(--ok-suave); color: var(--ok); font-weight: 600; }
.aviso.mal { background: var(--aviso-suave); color: var(--aviso); }
.aviso.neutro { background: var(--superficie-2); color: var(--tinta-suave); }

/* misión */
.historia { background: var(--pizarra); color: var(--pizarra-tinta); border-radius: 10px; padding: 16px 20px; margin-bottom: 18px; }
.historia p { margin: 0 0 8px; max-width: 75ch; }
.historia p:last-child { margin-bottom: 0; }
.acusar {
  position: sticky; bottom: 0; z-index: 4;
  background: var(--superficie); border: 2px solid var(--acento); border-radius: 10px;
  padding: 12px 14px; margin-top: 20px; box-shadow: 0 -4px 16px rgba(0, 0, 0, .08);
}
.acusar form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.acusar label { font-weight: 700; color: var(--acento); }
.acusar input {
  flex: 1; min-width: 180px; font: inherit; padding: 7px 10px;
  border: 1px solid var(--borde); border-radius: 7px; background: var(--codigo-fondo); color: var(--tinta);
}
.respuesta { margin-top: 10px; padding: 10px 12px; border-radius: 8px; display: none; }
.respuesta.visible { display: block; }
.respuesta .quien { font-weight: 700; display: block; margin-bottom: 2px; padding-right: 28px; }
.respuesta { position: relative; }
.cerrar { position: absolute; top: 4px; right: 6px; background: none; border: none; font-size: 20px; line-height: 1; color: inherit; opacity: .7; padding: 4px 6px; }
.cerrar:hover { opacity: 1; }
.respuesta.no { background: var(--superficie-2); }
.respuesta.giro { background: var(--aviso-suave); color: var(--aviso); }
.respuesta.culpable { background: var(--ok-suave); color: var(--ok); }
.respuesta.nadie { background: var(--superficie-2); color: var(--tinta-suave); }
.caso-cerrado { font-family: "Bree Serif", Georgia, serif; font-size: 24px; margin-top: 6px; }
.confeti { position: fixed; top: -40px; font-size: 28px; pointer-events: none; z-index: 50; animation: caer 3.2s linear forwards; }
@keyframes caer { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }

.pie { font-size: 13.5px; color: var(--tinta-suave); border-top: 1px solid var(--borde); margin-top: 40px; padding-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; }
.pie button { background: none; border: none; color: var(--tinta-suave); text-decoration: underline; padding: 0; font-size: 13.5px; }
.carga { padding: 60px 20px; text-align: center; color: var(--tinta-suave); }

@media (max-width: 820px) {
  .cuerpo { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--borde); }
  main { padding: 18px 16px 60px; }
  .rotulo { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .confeti { display: none; } }
</style>
</head>

<script>
(function () {
  "use strict";

  var PREFIJO = "barconsulta:v1:";
  var CDNS = [
    "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/",
    "https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/"
  ];
  var SQL = null;
  var db = null;
  var ultimoEditor = null;
  var tarjetasEjercicio = {};

  // ---------------------------------------------------------------- utilidades
  function guardar(clave, valor) { try { localStorage.setItem(PREFIJO + clave, valor); } catch (e) {} }
  function leer(clave) { try { return localStorage.getItem(PREFIJO + clave); } catch (e) { return null; } }
  function borrarTodo() {
    try {
      var claves = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(PREFIJO) === 0) claves.push(k);
      }
      claves.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) {}
  }

  function el(etiqueta, atributos, hijos) {
    var nodo = document.createElement(etiqueta);
    if (atributos) {
      Object.keys(atributos).forEach(function (k) {
        if (k === "texto") nodo.textContent = atributos[k];
        else if (k === "clase") nodo.className = atributos[k];
        else if (k.indexOf("on") === 0) nodo.addEventListener(k.slice(2), atributos[k]);
        else nodo.setAttribute(k, atributos[k]);
      });
    }
    (hijos || []).forEach(function (h) {
      if (h === null || h === undefined) return;
      nodo.appendChild(typeof h === "string" ? document.createTextNode(h) : h);
    });
    return nodo;
  }

  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }

  function textoEsperado(e) {
    if (e.filas === 1 && e.cols === 1) return "Resultado esperado: un solo número.";
    return "Resultado esperado: " + plural(e.filas, "fila", "filas") + " y " + plural(e.cols, "columna", "columnas") + ".";
  }

  // ---------------------------------------------------------------- huella del resultado (igual que en _generar.py)
  function cyrb53(str) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
    h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }
  function normCelda(v) {
    if (v === null || v === undefined) return "z";
    if (typeof v === "number") return "n" + Math.floor(v * 100 + 0.5);
    if (v instanceof Uint8Array) return "b" + v.length;
    return "s" + String(v);
  }
  function claveFila(fila) { return fila.map(normCelda).sort().join("\u001f"); }
  function huellas(filas) {
    var claves = filas.map(claveFila);
    return { ordenada: cyrb53(claves.join("\u001e")), sinOrden: cyrb53(claves.slice().sort().join("\u001e")) };
  }

  // ---------------------------------------------------------------- base de datos
  function cargarScript(url) {
    return new Promise(function (ok, mal) {
      var s = document.createElement("script");
      s.src = url;
      s.onload = ok;
      s.onerror = mal;
      document.head.appendChild(s);
    });
  }
  function base64ABytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function iniciarSQL() {
    for (var i = 0; i < CDNS.length; i++) {
      try {
        await cargarScript(CDNS[i] + "sql-wasm.js");
        var base = CDNS[i];
        return await window.initSqlJs({ locateFile: function (f) { return base + f; } });
      } catch (e) { /* probamos el siguiente */ }
    }
    throw new Error("No se ha podido cargar SQLite");
  }
  function abrirBD() {
    if (db) db.close();
    db = new SQL.Database(base64ABytes(BD_BASE64));
  }

  function ejecutar(sql) {
    var ultimo = null;
    var hubo = false;
    var it = db.iterateStatements(sql);
    try {
      for (var stmt of it) {
        hubo = true;
        var cols = stmt.getColumnNames();
        var filas = [];
        while (stmt.step()) filas.push(stmt.get());
        if (cols.length) ultimo = { cols: cols, filas: filas };
      }
    } catch (e) {
      try { it.finalize(); } catch (e2) {}
      throw e;
    }
    return { hubo: hubo, res: ultimo };
  }

  // ---------------------------------------------------------------- errores en español
  function traducirError(mensaje, sql) {
    var m;
    var texto = String(mensaje || "").replace(/^Error:\s*/, "");
    if (/\bTOP\s+\d+/i.test(sql)) return "En SQLite no existe TOP: se escribe LIMIT al final de la consulta (por ejemplo, LIMIT 5).";
    if ((m = texto.match(/no such table: (\S+)/))) return "No existe la tabla «" + m[1] + "». Mira cómo se escribe en el panel de la izquierda.";
    if ((m = texto.match(/no such column: (\S+)/))) return "No existe la columna «" + m[1] + "». Mira cómo se escribe en el panel de la izquierda. Si «" + m[1] + "» es un texto o una fecha, va entre comillas simples: '" + m[1] + "'.";
    if ((m = texto.match(/ambiguous column name: (\S+)/))) return "La columna «" + m[1] + "» está en las dos tablas. Escribe delante de qué tabla es: tabla." + m[1] + ".";
    if (/misuse of aggregate/.test(texto)) return "COUNT, SUM, AVG, MIN y MAX no se pueden usar dentro del WHERE. Para quedarte con algunos grupos, usa HAVING después del GROUP BY.";
    if (/a GROUP BY clause is required before HAVING/.test(texto)) return "HAVING va siempre después de un GROUP BY.";
    if (/incomplete input/.test(texto)) return "La consulta está a medias: ¿falta cerrar una comilla o un paréntesis?";
    if ((m = texto.match(/unrecognized token: "?(.+?)"?$/))) return "Hay algo que SQL no entiende: " + m[1] + ". ¿Se ha quedado una comilla sin cerrar?";
    if ((m = texto.match(/near "(.+?)": syntax error/))) return "Hay algo mal escrito cerca de «" + m[1] + "». Revisa las comas, las comillas y el orden: SELECT … FROM … WHERE … GROUP BY … ORDER BY … LIMIT …";
    if ((m = texto.match(/no such function: (\S+)/))) return "No existe la función «" + m[1] + "». ¿Está bien escrita?";
    if (/wrong number of arguments/.test(texto)) return "A esa función le sobran o le faltan cosas entre los paréntesis.";
    return "SQL ha dado un error.";
  }

  // ---------------------------------------------------------------- pintar resultados
  function formatear(v) {
    if (v === null || v === undefined) return "NULL";
    if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(parseFloat(v.toFixed(4)));
    if (v instanceof Uint8Array) return "(datos binarios)";
    return String(v);
  }
  function pintarTabla(res) {
    var MAX = 200;
    var caja = el("div", { clase: "resultado" });
    var n = res.filas.length;
    var resumen = plural(n, "fila", "filas") + " · " + plural(res.cols.length, "columna", "columnas");
    if (n > MAX) resumen += " · se enseñan las " + MAX + " primeras";
    caja.appendChild(el("div", { clase: "resumen", texto: resumen }));
    var thead = el("thead", null, [el("tr", null, res.cols.map(function (c) { return el("th", { texto: c }); }))]);
    var tbody = el("tbody");
    res.filas.slice(0, MAX).forEach(function (fila) {
      tbody.appendChild(el("tr", null, fila.map(function (v) {
        var clase = v === null ? "nulo" : (typeof v === "number" ? "numero" : (String(v).length > 60 ? "texto-largo" : ""));
        return el("td", { clase: clase, texto: formatear(v) });
      })));
    });
    caja.appendChild(el("div", { clase: "envoltura-tabla" }, [el("table", { clase: "tabla-res" }, [thead, tbody])]));
    return caja;
  }

  function comprobar(esperado, res) {
    if (!res) return { ok: false, msg: "La consulta no devuelve ninguna tabla. Empieza por SELECT." };
    var filas = res.filas.length, cols = res.cols.length;
    if (cols !== esperado.cols) {
      return { ok: false, msg: "Te salen " + plural(cols, "columna", "columnas") + " y deberían ser " + esperado.cols + ". Mira qué columnas pide el enunciado." };
    }
    if (filas !== esperado.filas) {
      if (filas === 0) return { ok: false, msg: "No sale ninguna fila y deberían salir " + esperado.filas + ". Si filtras por un texto, revisa las mayúsculas, las tildes y las comillas." };
      return { ok: false, msg: "Te salen " + plural(filas, "fila", "filas") + " y deberían salir " + esperado.filas + "." };
    }
    var h = huellas(res.filas);
    if (h.sinOrden !== esperado.h) return { ok: false, msg: "Salen las filas y columnas que tocan, pero algún dato no coincide. Revisa la condición o el cálculo." };
    if (esperado.ho !== null && h.ordenada !== esperado.ho) return { ok: false, msg: "Están todos los datos, pero en otro orden. Revisa el ORDER BY." };
    return { ok: true };
  }

  // ---------------------------------------------------------------- editor
  function crearEditor(id, alEjecutar) {
    var area = el("textarea", { spellcheck: "false", autocapitalize: "off", autocomplete: "off", "aria-label": "Consulta SQL " + id, rows: "3" });
    var guardado = leer("sql:" + id);
    if (guardado) area.value = guardado;
    var salida = el("div");
    var boton = el("button", { clase: "btn-ejecutar", type: "button", texto: "Ejecutar" });

    function ajustarAlto() {
      var lineas = area.value.split("\n").length;
      area.rows = Math.max(3, Math.min(lineas + 1, 18));
    }
    function correr() {
      if (!db) return;
      var sql = area.value.trim();
      salida.innerHTML = "";
      if (!sql) {
        salida.appendChild(el("div", { clase: "aviso neutro", texto: "Escribe una consulta y pulsa Ejecutar." }));
        return;
      }
      var r;
      try {
        r = ejecutar(sql);
      } catch (e) {
        var caja = el("div", { clase: "aviso error" }, [traducirError(e.message, sql)]);
        caja.appendChild(el("span", { clase: "original", texto: String(e.message || e) }));
        salida.appendChild(caja);
        if (alEjecutar) alEjecutar(null, true);
        return;
      }
      if (alEjecutar) {
        var extra = alEjecutar(r.res, false);
        if (extra) salida.appendChild(extra);
      }
      if (r.res) salida.appendChild(pintarTabla(r.res));
      else salida.appendChild(el("div", { clase: "aviso neutro", texto: "Hecho. La consulta no devuelve ninguna tabla." }));
    }

    area.addEventListener("focus", function () { ultimoEditor = area; });
    area.addEventListener("input", function () { guardar("sql:" + id, area.value); ajustarAlto(); });
    area.addEventListener("keydown", function (ev) {
      if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") { ev.preventDefault(); correr(); }
      else if (ev.key === "Tab" && !ev.shiftKey) {
        ev.preventDefault();
        insertarEn(area, "  ");
      }
    });
    boton.addEventListener("click", correr);
    ajustarAlto();
    var esMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    return el("div", { clase: "editor" }, [
      area,
      el("div", { clase: "barra-editor" }, [boton, el("span", { clase: "atajo", texto: esMac ? "o Cmd + Enter" : "o Ctrl + Enter" })]),
      salida
    ]);
  }

  function insertarEn(area, texto) {
    var ini = area.selectionStart, fin = area.selectionEnd;
    area.value = area.value.slice(0, ini) + texto + area.value.slice(fin);
    area.selectionStart = area.selectionEnd = ini + texto.length;
    area.dispatchEvent(new Event("input"));
  }
  function insertarNombre(nombre) {
    if (!ultimoEditor || !document.body.contains(ultimoEditor) || ultimoEditor.offsetParent === null) return;
    ultimoEditor.focus();
    var antes = ultimoEditor.value.slice(0, ultimoEditor.selectionStart);
    var hueco = antes.length && !/[\s(,.]$/.test(antes) ? " " : "";
    insertarEn(ultimoEditor, hueco + nombre);
  }

  // ---------------------------------------------------------------- panel de tablas
  function pintarPanel() {
    var panel = document.getElementById("panel");
    panel.innerHTML = "";
    var tablas = db.exec("SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY rowid")[0].values.map(function (f) { return f[0]; });
    var delCaso = DATOS.tablas_mision;
    function grupo(titulo, lista, segundo) {
      panel.appendChild(el("h2", { clase: segundo ? "segundo" : "", texto: titulo }));
      lista.forEach(function (t) {
        var n = db.exec("SELECT COUNT(*) FROM " + t)[0].values[0][0];
        var cols = db.exec("PRAGMA table_info(" + t + ")")[0].values;
        var lista2 = el("ul", { clase: "columnas" }, cols.map(function (c) {
          var tipo = { INTEGER: "entero", REAL: "decimal", TEXT: "texto" }[c[2]] || c[2].toLowerCase();
          return el("li", null, [
            el("button", { clase: "col-nombre", type: "button", texto: c[1], title: "Escribir " + c[1] + " en el editor", onclick: function () { insertarNombre(c[1]); } }),
            el("span", { clase: "col-tipo", texto: tipo })
          ]);
        }));
        var detalles = el("details", { clase: "tabla" }, [
          el("summary", null, [
            el("button", { clase: "tabla-nombre", type: "button", texto: t, title: "Escribir " + t + " en el editor", onclick: function (ev) { ev.preventDefault(); insertarNombre(t); } }),
            el("span", { clase: "tabla-filas", texto: n + " filas" })
          ]),
          lista2
        ]);
        panel.appendChild(detalles);
      });
    }
    panel.appendChild(el("p", { clase: "ayuda", texto: "Pincha en un nombre para escribirlo en el editor. Con ▸ ves sus columnas." }));
    grupo("Tablas del bar", tablas.filter(function (t) { return delCaso.indexOf(t) === -1; }), false);
    grupo("Tablas del caso", tablas.filter(function (t) { return delCaso.indexOf(t) !== -1; }), true);
  }

  // ---------------------------------------------------------------- pestañas y bloques
  var pestanas = {};
  function actualizarProgreso(bloque) {
    if (!bloque.ejercicios || !bloque.ejercicios.length) return;
    var hechos = bloque.ejercicios.filter(function (e) { return leer("ok:" + e.id) === "1"; }).length;
    var marca = pestanas[bloque.id].querySelector(".progreso");
    marca.textContent = hechos + "/" + bloque.ejercicios.length;
    marca.classList.toggle("completo", hechos === bloque.ejercicios.length);
  }

  function pintarBloque(bloque) {
    var sec = el("section", { clase: "bloque", id: "sec-" + bloque.id, role: "tabpanel" });
    sec.appendChild(el("h1", { texto: bloque.titulo }));
    if (bloque.intro) sec.appendChild(el("p", { clase: "intro", texto: bloque.intro }));
    if (bloque.docs && bloque.docs.length) {
      sec.appendChild(el("p", { clase: "docs" }, ["Documentación: "].concat(bloque.docs.map(function (d) {
        return el("a", { href: d[1], target: "_blank", rel: "noopener", texto: d[0] });
      }))));
    }
    sec.appendChild(el("h2", { clase: "seccion", texto: "Ejemplos" }));
    bloque.ejemplos.forEach(function (ej) {
      sec.appendChild(el("div", { clase: "tarjeta" }, [
        el("div", { clase: "cab-tarjeta" }, [el("span", { clase: "num", texto: ej.id })]),
        crearEditor(ej.id)
      ]));
    });
    sec.appendChild(el("h2", { clase: "seccion", texto: "Ejercicios" }));
    bloque.ejercicios.forEach(function (ej) {
      var marcaOk = el("span", { clase: "marca-ok", texto: "" });
      var tarjeta = el("div", { clase: "tarjeta" });
      var pista = el("p", { clase: "pista", texto: "Pista: " + ej.pista, hidden: "" });
      var btnPista = el("button", { clase: "btn-pista", type: "button", texto: "Ver pista", onclick: function () { pista.hidden = false; btnPista.remove(); } });
      function marcar(ok) {
        tarjeta.classList.toggle("resuelto", ok);
        marcaOk.textContent = ok ? "Resuelto" : "";
      }
      tarjeta.appendChild(el("div", { clase: "cab-tarjeta" }, [el("span", { clase: "num", texto: ej.id }), marcaOk]));
      tarjeta.appendChild(el("p", { clase: "enunciado", texto: ej.enunciado }));
      tarjeta.appendChild(el("p", { clase: "esperado" }, [textoEsperado(ej.esperado) + " ", ej.pista ? btnPista : null]));
      if (ej.pista) tarjeta.appendChild(pista);
      tarjeta.appendChild(crearEditor(ej.id, function (res, error) {
        if (error) return null;
        var v = comprobar(ej.esperado, res);
        if (v.ok) {
          guardar("ok:" + ej.id, "1");
          marcar(true);
          actualizarProgreso(bloque);
          return el("div", { clase: "aviso ok", texto: "¡Correcto! Escribe «" + ej.id + " listo» en el chat." });
        }
        return el("div", { clase: "aviso mal", texto: v.msg });
      }));
      if (leer("ok:" + ej.id) === "1") marcar(true);
      tarjetasEjercicio[ej.id] = tarjeta;
      sec.appendChild(tarjeta);
    });
    return sec;
  }

  // ---------------------------------------------------------------- misión
  function descifrar(b64) {
    var bytes = base64ABytes(b64);
    var clave = "LaConsulta";
    for (var i = 0; i < bytes.length; i++) bytes[i] ^= clave.charCodeAt(i % clave.length);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function normNombre(s) {
    return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  }
  function confeti() {
    var cosas = ["🍺", "🧾", "🍤", "🥘", "🍷", "🎉"];
    for (var i = 0; i < 28; i++) {
      var s = el("span", { clase: "confeti", texto: cosas[i % cosas.length] });
      s.style.left = Math.round(Math.random() * 96) + "vw";
      s.style.animationDelay = (Math.random() * 0.9).toFixed(2) + "s";
      document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 4500);
    }
  }

  function pintarMision(m) {
    var acus = descifrar(DATOS.acus);
    var sec = el("section", { clase: "bloque", id: "sec-" + m.id, role: "tabpanel" });
    sec.appendChild(el("h1", { texto: m.titulo }));
    sec.appendChild(el("div", { clase: "historia" }, m.historia.map(function (p) { return el("p", { texto: p }); })));
    m.pasos.forEach(function (p) {
      sec.appendChild(el("div", { clase: "tarjeta" }, [
        el("div", { clase: "cab-tarjeta" }, [el("span", { clase: "num", texto: p.id }), el("span", { clase: "titulo-paso", texto: p.titulo })]),
        el("p", { clase: "enunciado", texto: p.enunciado }),
        el("p", { clase: "esperado", texto: "Resultado esperado: " + plural(p.filas, "fila", "filas") + "." }),
        crearEditor(p.id, function (res, error) {
          if (error || !res) return null;
          if (res.filas.length === p.filas) return el("div", { clase: "aviso neutro", texto: "Sale lo esperado: " + plural(p.filas, "fila", "filas") + ". Lee bien lo que dicen." });
          return el("div", { clase: "aviso mal", texto: "Te salen " + plural(res.filas.length, "fila", "filas") + " y se esperaban " + p.filas + "." });
        })
      ]));
    });

    var entrada = el("input", { type: "text", id: "acusado", placeholder: "Nombre y apellido", autocomplete: "off" });
    var respuesta = el("div", { clase: "respuesta", "aria-live": "polite" });
    function acusar(ev) {
      ev.preventDefault();
      var nombre = entrada.value;
      if (!nombre.trim()) return;
      var r = acus.r[normNombre(nombre)];
      respuesta.innerHTML = "";
      respuesta.className = "respuesta visible " + (r ? r[0] : "nadie");
      respuesta.appendChild(el("button", { clase: "cerrar", type: "button", "aria-label": "Cerrar", texto: "×", onclick: function () { respuesta.className = "respuesta"; } }));
      if (!r) {
        respuesta.appendChild(document.createTextNode(acus.nadie));
        return;
      }
      respuesta.appendChild(el("span", { clase: "quien", texto: r[2] + ":" }));
      respuesta.appendChild(document.createTextNode("«" + r[1] + "»"));
      if (r[0] === "culpable") {
        respuesta.appendChild(el("div", { clase: "caso-cerrado", texto: "¡Caso cerrado! Escribe «caso cerrado» en el chat, sin decir el nombre." }));
        guardar("caso", "cerrado");
        marcarCaso();
        confeti();
      }
    }
    sec.appendChild(el("div", { clase: "acusar" }, [
      el("form", { onsubmit: acusar }, [
        el("label", { for: "acusado", texto: "Acusar" }),
        entrada,
        el("button", { clase: "btn-ejecutar", type: "submit", texto: "Acusar" })
      ]),
      respuesta
    ]));
    return sec;
  }

  function marcarCaso() {
    var p = pestanas[DATOS.mision.id];
    if (!p || leer("caso") !== "cerrado") return;
    var marca = p.querySelector(".progreso");
    marca.textContent = "cerrado";
    marca.classList.add("completo");
  }

  // ---------------------------------------------------------------- arranque
  function mostrar(id) {
    Object.keys(pestanas).forEach(function (k) {
      var activa = k === id;
      pestanas[k].setAttribute("aria-selected", activa ? "true" : "false");
      document.getElementById("sec-" + k).classList.toggle("activo", activa);
    });
    guardar("pestana", id);
    if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    window.scrollTo(0, 0);
  }

  function montar() {
    var nav = document.getElementById("pestanas");
    var main = document.getElementById("contenido");
    main.innerHTML = "";
    var todos = DATOS.bloques.concat([DATOS.mision, DATOS.extra]);
    todos.forEach(function (b) {
      var p = el("button", { clase: "pestana", role: "tab", type: "button", onclick: function () { mostrar(b.id); } }, [b.pestana]);
      if (b.ejercicios || b.pasos) p.appendChild(el("span", { clase: "progreso" }));
      nav.appendChild(p);
      pestanas[b.id] = p;
      main.appendChild(b.pasos ? pintarMision(b) : pintarBloque(b));
      actualizarProgreso(b);
    });
    main.appendChild(el("footer", { clase: "pie" }, [
      el("a", { href: "bar.db", download: "bar.db", texto: "Descargar la base de datos (bar.db)" }),
      el("button", { type: "button", texto: "Borrar mis consultas y mi progreso", onclick: function () {
        if (confirm("¿Seguro? Se borran todas tus consultas y los ejercicios resueltos de este navegador.")) { borrarTodo(); location.reload(); }
      } })
    ]));
    marcarCaso();
    var inicial = (location.hash || "").slice(1);
    if (!pestanas[inicial]) inicial = leer("pestana");
    if (!pestanas[inicial]) inicial = todos[0].id;
    mostrar(inicial);
    window.addEventListener("hashchange", function () {
      var id = location.hash.slice(1);
      if (pestanas[id]) mostrar(id);
    });
  }

  async function arrancar() {
    var estado = document.getElementById("estado-bd");
    try {
      SQL = await iniciarSQL();
      abrirBD();
    } catch (e) {
      estado.textContent = "Sin base de datos";
      document.getElementById("contenido").innerHTML = "";
      document.getElementById("contenido").appendChild(el("div", { clase: "aviso error", texto: "No se ha podido cargar SQLite en el navegador. Revisa la conexión a internet y recarga la página (F5)." }));
      return;
    }
    estado.textContent = "Base de datos lista";
    pintarPanel();
    montar();
    document.getElementById("btn-restaurar").addEventListener("click", function () {
      abrirBD();
      pintarPanel();
      estado.textContent = "Base de datos restaurada";
      setTimeout(function () { estado.textContent = "Base de datos lista"; }, 2500);
    });
    window.__bar = { ejecutar: ejecutar, huellas: huellas, comprobar: comprobar, datos: DATOS };
  }
  arrancar();
})();
</script>

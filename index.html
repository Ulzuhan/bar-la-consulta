TEXT\n);\n\nINSERT INTO proveedores (nombre, telefono)\nVALUES ('Quesos La Mancha', '600101010'), ('Bodegas Rivas', NULL);\n\nSELECT * FROM proveedores;"}], "ejercicios": [{"id": "D.1", "enunciado": "Apunta esta reserva: el sábado 14 de noviembre de 2026 a las 15:00, a nombre de Hermanos Ortega, 7 personas, en el salón. No han dejado teléfono.", "pista": "Mira cómo están escritas las otras reservas: la fecha, la hora y la zona. Una columna que no pones se queda vacía.", "verifica": "SELECT fecha, hora, personas, zona, telefono IS NULL OR telefono = 'pedir teléfono' FROM reservas WHERE nombre = 'Hermanos Ortega'", "esperado": {"filas": 1, "cols": 5, "h": 6882439714117827, "ho": null}}, {"id": "D.2", "enunciado": "Llama Marisa Campos: al final son 6.", "pista": "Solo tiene que cambiar su reserva. Mira las demás después de ejecutar.", "verifica": "SELECT id, personas FROM reservas WHERE id IN (1, 2, 4, 5)", "esperado": {"filas": 4, "cols": 2, "h": 8027109737639052, "ho": null}}, {"id": "D.3", "enunciado": "El viernes 13 va a llover. Pasa al salón todas las reservas de terraza de ese día, y solo las de ese día.", "pista": "Antes de cambiar nada, saca con un SELECT las reservas que quieres cambiar. Cuando salgan solo esas, usa el mismo WHERE.", "verifica": "SELECT id, zona FROM reservas WHERE id IN (3, 5, 6, 7)", "esperado": {"filas": 4, "cols": 2, "h": 8046835886546420, "ho": null}}, {"id": "D.4", "enunciado": "La despedida de Bea está apuntada dos veces. Borra la repetida: la que se apuntó más tarde.", "pista": "Las dos filas son iguales en todo menos en una columna.", "verifica": "SELECT id FROM reservas WHERE nombre = 'Despedida de Bea' OR id = 8", "esperado": {"filas": 2, "cols": 1, "h": 8962064962263669, "ho": null}}, {"id": "D.5", "enunciado": "A las reservas que no tienen teléfono, ponles el texto 'pedir teléfono'.", "pista": "Si ejecutas y no cambia ninguna fila, acuérdate de cómo se pregunta por una casilla vacía.", "verifica": "SELECT id, telefono FROM reservas WHERE id IN (2, 3, 7, 10)", "esperado": {"filas": 4, "cols": 2, "h": 4359176114204820, "ho": null}}, {"id": "D.6", "enunciado": "El domingo 15 el bar cierra por una avería. Borra todas las reservas de ese día.", "pista": "Primero el SELECT con ese WHERE, para ver qué vas a borrar.", "verifica": "SELECT id FROM reservas WHERE fecha = '2026-11-15' OR id IN (4, 8)", "esperado": {"filas": 2, "cols": 1, "h": 919691063426794, "ho": null}}, {"id": "D.7", "enunciado": "Los sábados hay cola. Crea una tabla lista_espera con dos columnas, nombre (texto) y personas (un número), y apunta a Sergio, que son 4, y a Las del pádel, que son 6.", "pista": "Dos consultas en el mismo recuadro, separadas por punto y coma: una crea la tabla y la otra mete las filas.", "verifica": "SELECT nombre, personas FROM lista_espera", "esperado": {"filas": 2, "cols": 2, "h": 7564614977276253, "ho": null}}]}, {"id": "con", "pestana": "WITH", "titulo": "Consultas por pasos: WITH", "intro": "Cuando una consulta necesita varios pasos, con WITH se le pone nombre a cada paso y después se usa como si fuera una tabla. Se lee de arriba abajo.", "docs": [["WITH", "https://www.sqlitetutorial.net/sqlite-cte/"], ["UNION", "https://www.w3schools.com/sql/sql_union.asp"]], "teoria": "with", "ejemplos": [{"id": "W.a", "texto": "Los días que se facturó más que en un día medio, en dos pasos.", "sql": "WITH por_dia AS (\n  SELECT fecha, SUM(total) AS facturado\n  FROM comandas\n  GROUP BY fecha\n)\nSELECT fecha, facturado\nFROM por_dia\nWHERE facturado > (SELECT AVG(facturado) FROM por_dia)\nORDER BY facturado DESC;"}, {"id": "W.b", "texto": "Lo vendido y lo anulado con el código de cada persona.", "sql": "WITH ventas AS (\n  SELECT camarero_id, SUM(total) AS vendido\n  FROM comandas\n  GROUP BY camarero_id\n),\nanulado AS (\n  SELECT personal_id, SUM(importe) AS anulado\n  FROM anulaciones\n  GROUP BY personal_id\n)\nSELECT p.nombre, v.vendido, a.anulado\nFROM personal AS p\nJOIN ventas AS v ON v.camarero_id = p.id\nJOIN anulado AS a ON a.personal_id = p.id\nORDER BY v.vendido DESC;"}, {"id": "W.c", "texto": "Todo lo que pasó el sábado 7 de noviembre, en una sola lista.", "sql": "SELECT 'incidencia' AS que, tipo AS detalle\nFROM incidencias\nWHERE fecha = '2026-11-07'\nUNION ALL\nSELECT 'anulación', motivo\nFROM anulaciones\nWHERE fecha = '2026-11-07';"}], "ejercicios": [{"id": "W.1", "enunciado": "¿Cuánto factura el bar en un día medio? Redondeado a 2 decimales.", "pista": "Primero, lo de cada día. Después, la media de eso.", "abierta": true, "esperado": {"filas": 1, "claves": [4801514169869065]}}, {"id": "W.2", "enunciado": "¿Cuántos días se han facturado más de 1.000 €?", "pista": "El primer paso es el mismo de antes. Lo que cambia es qué haces con él.", "abierta": true, "esperado": {"filas": 1, "claves": [5288959755914308]}}, {"id": "W.3", "enunciado": "¿Cuántas cosas se piden de media en una comanda? Cuenta las unidades, no las líneas. Redondeado a 2 decimales.", "pista": "Un paso para saber cuántas cosas tiene cada comanda. Otro para la media.", "abierta": true, "esperado": {"filas": 1, "claves": [3543104623704654]}}, {"id": "W.4", "enunciado": "Lo que se factura en un día medio de cada día de la semana, redondeado a 2 decimales. Es el F.6, pero ahora por pasos.", "pista": "Si ya tienes una fila por día, la media por día de la semana es un GROUP BY normal.", "abierta": true, "esperado": {"filas": 6, "claves": [6787814838566817, 5119412653013862, 8155047689339374, 5516736229088450, 3463218291791618, 3998126394093312]}}, {"id": "W.5", "enunciado": "Rosa quiere reunir a todos los que declararon por el caso y a toda la cocina. Saca una sola lista de nombres, sin repetir a nadie.", "pista": "Los nombres están en dos tablas, y hay quien sale en las dos.", "abierta": true, "esperado": {"filas": 10, "claves": [6852123584940915, 6320715511233956, 3000663620777714, 1069303903261182, 7451263137461174, 4127640670947521, 5755733449396897, 8281747806559383, 4148449264152535, 6720534868738354]}}, {"id": "W.6", "enunciado": "¿Qué porcentaje de lo que vende cada persona se acaba anulando con su código? Con su nombre y redondeado a 1 decimal.", "pista": "Lo vendido y lo anulado salen de tablas distintas. Si las juntas antes de sumar, las filas se repiten.", "abierta": true, "esperado": {"filas": 10, "claves": [3000663620777714, 5755733449396897, 6720534868738354, 6320715511233956, 3801944920407424, 5201377092558654, 4262501684668327, 6801368537676275, 8281747806559383, 1140492044707901, 3438100565884523, 7514362076787911, 52004895785262, 2807196518814505, 5656224872885700, 761131408812250, 3765445916935855, 6433354619683086]}}]}, {"id": "ventanas", "pestana": "Ventanas", "titulo": "Rankings y acumulados: funciones de ventana", "intro": "GROUP BY junta las filas de un grupo en una sola. Una función de ventana hace el cálculo del grupo y deja todas las filas. Sirve para poner el puesto en un ranking, llevar un acumulado o comparar cada fila con la anterior.", "docs": [["Funciones de ventana", "https://www.sqlitetutorial.net/sqlite-window-functions/"]], "teoria": "ventanas", "ejemplos": [{"id": "V.a", "texto": "La carta, con el puesto de cada plato por precio.", "sql": "SELECT plato, precio,\n  RANK() OVER (ORDER BY precio DESC) AS puesto\nFROM carta;"}, {"id": "V.b", "texto": "Lo mismo, pero con un ranking dentro de cada categoría.", "sql": "SELECT categoria, plato, precio,\n  RANK() OVER (PARTITION BY categoria ORDER BY precio DESC) AS puesto\nFROM carta;"}, {"id": "V.c", "texto": "El plato más caro de cada categoría.", "sql": "WITH ranking AS (\n  SELECT categoria, plato, precio,\n    RANK() OVER (PARTITION BY categoria ORDER BY precio DESC) AS puesto\n  FROM carta\n)\nSELECT categoria, plato, precio\nFROM ranking\nWHERE puesto = 1;"}, {"id": "V.d", "texto": "Lo facturado cada día y lo que se lleva acumulado.", "sql": "WITH por_dia AS (\n  SELECT fecha, SUM(total) AS facturado\n  FROM comandas\n  GROUP BY fecha\n)\nSELECT fecha, facturado,\n  SUM(facturado) OVER (ORDER BY fecha) AS acumulado\nFROM por_dia;"}, {"id": "V.e", "texto": "Lo facturado cada día y la diferencia con el día anterior.", "sql": "WITH por_dia AS (\n  SELECT fecha, SUM(total) AS facturado\n  FROM comandas\n  GROUP BY fecha\n)\nSELECT fecha, facturado,\n  facturado - LAG(facturado) OVER (ORDER BY fecha) AS diferencia\nFROM por_dia;"}], "ejercicios": [{"id": "V.1", "enunciado": "Numera al personal por antigüedad: el 1 es quien lleva más tiempo en el bar. Muestra el nombre, la fecha de alta y el número.", "pista": "No hay que agrupar nada: solo ordenar por una columna y poner el número.", "esperado": {"filas": 15, "cols": 3, "h": 2690105185267174, "ho": null}}, {"id": "V.2", "enunciado": "Las 3 comandas más caras de cada zona del bar. Con el id, la zona, el total y el puesto.", "pista": "Primero el puesto de cada comanda dentro de su zona. El filtro va en un segundo paso.", "abierta": true, "esperado": {"filas": 9, "claves": [5667616347977940, 4421158357629175, 5221305515293300, 5258976036354238, 7896485787016398, 2350584811101172, 5852345608912688, 126030809701495, 1518637028401198]}}, {"id": "V.3", "enunciado": "Lo facturado cada día de noviembre y lo que se lleva acumulado en el mes.", "pista": "El acumulado tiene que empezar en el primer día de noviembre, no en octubre.", "abierta": true, "esperado": {"filas": 6, "claves": [5690794952305088, 1736726073684547, 93487537790679, 1151285502999527, 290621335558263, 6069044447330259]}}, {"id": "V.4", "enunciado": "¿Cuál es el plato más vendido de cada categoría? Con la categoría, el plato y las unidades.", "pista": "No se puede hacer el ranking hasta saber cuántas unidades se han vendido de cada plato.", "abierta": true, "esperado": {"filas": 5, "claves": [7406297653190737, 2184030861682518, 7932942121021705, 6769949943523846, 5706977646674869, 4354162195392085, 4612406092717643, 2275039332526555, 8211848196912607, 1434650326399474]}}, {"id": "V.5", "enunciado": "¿Qué día subió más la facturación respecto al día anterior que abrió el bar, y cuánto subió?", "pista": "Primero la diferencia de cada día con el anterior. Después, la más grande.", "abierta": true, "esperado": {"filas": 1, "claves": [8329363708343667, 1706100658856093]}}, {"id": "V.6", "enunciado": "De todas las unidades que se venden de una categoría, ¿qué porcentaje es de cada plato? Con la categoría, el plato y el porcentaje, redondeado a 1 decimal.", "pista": "El total de la categoría se puede poner al lado de cada plato con una suma que mire solo a su categoría.", "abierta": true, "esperado": {"filas": 30, "claves": [5717873575836053, 6568299562040803, 5811162442259274, 6133446201042266, 6217985172820570, 1400846198205109, 6589291798200526, 7946589949774584, 5267896817306129, 2832549647983738, 2419625841103218, 4987320473451311, 4295033795625681, 6106823805371065, 3671627724228373, 4730417758056902, 4356465347077445, 2421141234349772, 7487998245157935, 4029885287512387, 5274495985092476, 3445460692244337, 1381507454579219, 5913355558269164, 7539998629595886, 6850680343002846, 6481597525696819]}}]}, {"id": "entrevista", "pestana": "Entrevista", "titulo": "La entrevista", "intro": "Rosa ha ido contando que le arreglaste el bar con SQL, y te llaman de una cadena de restaurantes para una prueba técnica. Estas son las preguntas, con los datos del bar. Son de las que caen en las entrevistas de analista. No dicen qué usar y casi todas se pueden resolver de más de una forma.", "docs": [], "teoria": null, "ejemplos": [], "ejercicios": [{"id": "T.1", "enunciado": "¿Cuál es el segundo plato más caro de la carta?", "pista": "El segundo más caro es el más caro de los que quedan cuando quitas el primero.", "abierta": true, "esperado": {"filas": 1, "claves": [6769949943523846]}}, {"id": "T.2", "enunciado": "¿Qué precios se repiten en la carta, y cuántos platos hay de cada uno?", "pista": "Buscar repetidos es contar cuántas veces sale cada valor y quedarse con los que salen más de una.", "abierta": true, "esperado": {"filas": 5, "claves": [6188407907406152, 8956801286487481, 8725399173163838, 3844535896589830, 1551908163998469, 6850631215620371, 7298060877653443]}}, {"id": "T.3", "enunciado": "¿Quién ha facturado más en cada zona del bar? Con la zona, el nombre y lo facturado.", "pista": "Una sola persona por zona. Con ORDER BY y LIMIT solo sacas una fila en total.", "abierta": true, "esperado": {"filas": 3, "claves": [3801944920407424, 5201377092558654, 551860708208769, 3765550386743109, 924959292257939]}}, {"id": "T.4", "enunciado": "¿Qué porcentaje del dinero deja cada categoría de la carta? Redondeado a 1 decimal.", "pista": "Primero el dinero de cada categoría. El total es la suma de eso.", "abierta": true, "esperado": {"filas": 5, "claves": [2792390679117915, 1376641286713675, 5717873575836053, 5904503498314362, 4356465347077445]}}, {"id": "T.5", "enunciado": "De los días que abrió el bar, ¿en cuántos no se anuló ningún ticket?", "pista": "Los días que abrió salen de una tabla y los días con anulaciones, de otra.", "abierta": true, "esperado": {"filas": 1, "claves": [6217985172820570]}}, {"id": "T.6", "enunciado": "Lo facturado cada semana (de lunes a domingo) y la diferencia con la semana anterior.", "pista": "Primero una fila por semana. Después, cada fila mira a la anterior.", "abierta": true, "esperado": {"filas": 6, "claves": [243530538881798, 4944436294227538, 8014165356265657, 1468490601178588, 3220591072059817, 3059167885102976]}}, {"id": "T.7", "enunciado": "¿Qué platos cuestan más que la media de su propia categoría? Con la categoría, el plato y el precio.", "pista": "Cada plato se compara con un número distinto según su categoría. Ese número hay que tenerlo al lado de cada plato.", "abierta": true, "esperado": {"filas": 14, "claves": [1926663533069351, 8816667807056288, 5706977646674869, 3172452487466100, 4381076555448201, 6769949943523846, 1151376967153562, 266913091017434, 1775587999068363, 5177534019875088, 7932942121021705, 1848907058165151, 3535960   function cyrb53(str) {

  function teSalen(n, uno, varios) {

  function comprobar(esperado, res) {
    if (!res) return { ok: false, msg: "La consulta no devuelve ninguna tabla. Empieza por SELECT." };
    var filas = res.filas.length, cols = res.cols.length;

    }

    if (h.sinOrden !== esperado.h) return { ok: false, msg: "Salen las filas y columnas que tocan, pero algún dato no coincide. Revisa la condición o el cálculo." };
    if (esperado.ho !== null && h.ordenada !== esperado.ho) return { ok: false, msg: "Están todos los datos, pero en otro orden. Revisa el ORDER BY." };

    function correr() {

  // ---------------------------------------------------------------- misión
  function descifrar(b64) {
    var bytes = base64ABytes(b64);
    var clave = "LaConsulta";
    for (var i = 0; i < bytes.length; i++) bytes[i] ^= clave.charCodeAt(i % clave.length);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function normNombre(s) {
    return String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  }
  function centimos(texto) {
    var t = String(texto || "").replace(/€/g, "").replace(/\s/g, "");
    if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, "");   // 1.234,50
    t = t.replace(",", ".");
    if (!/^\d+(\.\d+)?$/.test(t)) return null;
    return Math.round(parseFloat(t) * 100);
  }

  function comprobarClaves(esperado, res) {
    if (!res) return { ok: false, msg: "La consulta no devuelve ninguna tabla. Empieza por SELECT." };
    if (res.filas.length !== esperado.filas) {
      return { ok: false, msg: teSalen(res.filas.length, "fila", "filas") + " y " + (esperado.filas === 1 ? "se esperaba " : "se esperaban ") + esperado.filas + "." };
    }
    var celdas = {};
    res.filas.forEach(function (fila) { fila.forEach(function (v) { celdas[cyrb53(normCelda(v))] = true; }); });
    var faltan = esperado.claves.filter(function (h) { return !celdas[h]; }).length;
    if (faltan) {
      return { ok: false, msg: "Sale el número de filas que toca, pero no lo que buscas. Revisa la condición, y que se vean las columnas que hacen falta para responder." };
    }
    if (esperado.orden) {
      var enOrden = res.filas.every(function (fila, i) {
        return fila.some(function (v) { return cyrb53(normCelda(v)) === esperado.orden[i]; });
      });
      if (!enOrden) return { ok: false, msg: "Salen las filas que tocan, pero no en el orden que se pide." };
    }
    return { ok: true };
  }

  // Ejercicios que cambian datos: se mira cómo ha quedado la tabla con la consulta de comprobación.
  function corregir(ej, res) {
    if (ej.verifica) {
      var mal = { ok: false, msg: "Todavía no: la tabla no ha quedado como pide el enunciado. Mírala con un SELECT. Si has ejecutado lo mismo varias veces, pulsa Restaurar la base de datos y vuelve a probar." };
      try { return comprobar(ej.esperado, ejecutar(ej.verifica).res).ok ? { ok: true } : mal; } catch (e) { return mal; }
    }
    return ej.abierta ? comprobarClaves(ej.esperado, res) : comprobar(ej.esperado, res);
  }

  function comprobarPaso(p, res) {
    var v = comprobarClaves(p, res);
    if (!v.ok) return el("div", { clase: "aviso mal", texto: v.msg.replace("para responder", "para seguir") });
    return el("div", { clase: "aviso ok", texto: "Bien. Léelo con calma antes de seguir." });
  }

    function contestar(clase, quien, texto) {

      if (dinero !== acus.c) { contestar("no", acus.mal[0], acus.mal[1]); return; }
      var r = acus.r[normNombre(nombre)];
      if (!r) { contestar("nadie", null, acus.nadie); return; }
      contestar(r[0], r[2], r[1]);

  // ---------------------------------------------------------------- descargar y cargar el trabajo
  // El archivo es SQL normal: cada consulta va detrás de una línea "-- [2.4] enunciado".
  function piezas() {
    var lista = [];
    DATOS.bloques.concat([DATOS.mision], DATOS.extras).forEach(function (b) {
      (b.ejemplos || []).forEach(function (e) { lista.push({ id: e.id, bloque: b.pestana, texto: "Ejemplo: " + (e.texto || "") }); });
      (b.ejercicios || []).forEach(function (e) { lista.push({ id: e.id, bloque: b.pestana, texto: e.enunciado, ejercicio: true }); });
      (b.pasos || []).forEach(function (e) { lista.push({ id: e.id, bloque: b.pestana, texto: e.titulo }); });
    });
    return lista;
  }
  function recuadro(id) { return document.querySelector('textarea[aria-label="Consulta SQL ' + id + '"]'); }
  function escrito(area) {
    var texto = area ? area.value.trim() : "";
    return area && area.dataset.inicial && texto === area.dataset.inicial.trim() ? "" : texto;
  }
  function hayAlgoEscrito() {
    return Array.prototype.some.call(document.querySelectorAll("main textarea"), function (a) { return escrito(a) !== ""; });
  }
  function avisoEstado(texto) {
    var estado = document.getElementById("estado-bd");
    estado.textContent = texto;
    setTimeout(function () { estado.textContent = "Base de datos lista"; }, 3500);
  }

  function descargarTrabajo() {
    var ahora = new Date();
    var lineas = [
      "-- Bar La Consulta: mis consultas",
      "-- Descargado el " + ahora.toLocaleDateString("es-ES") + " a las " + ahora.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }),
      "-- Para recuperarlas, abre " + location.origin + location.pathname + " y pulsa \"Cargar mi trabajo\"."
    ];
    if (leer("caso") === "cerrado") lineas.push("-- Caso cerrado: sí");
    var hechos = Object.keys(marcadores).filter(function (id) { return marcadores[id].ej.verifica && leer("ok:" + id) === "1"; });
    if (hechos.length) lineas.push("-- Resueltos de cambiar datos: " + hechos.join(", "));
    var bloque = null;
    var n = 0;
    piezas().forEach(function (p) {
      var texto = escrito(recuadro(p.id));
      if (!texto) return;
      if (p.bloque !== bloque) { lineas.push("", "-- ## " + p.bloque); bloque = p.bloque; }
      lineas.push("", "-- [" + p.id + "] " + p.texto.replace(/\s+/g, " "), texto);
      n++;
    });
    if (!n) { alert("Todavía no has escrito ninguna consulta."); return; }
    var url = URL.createObjectURL(new Blob([lineas.join("\n") + "\n"], { type: "text/plain;charset=utf-8" }));
    var enlace = el("a", { href: url, download: "mis_consultas_bar.sql" });
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    avisoEstado("Trabajo descargado (" + plural(n, "consulta", "consultas") + ")");
  }

  function leerArchivo(texto) {
    var partes = {};
    var actual = null;
    var caso = false;
    var hechos = {};
    texto.replace(/\r\n?/g, "\n").split("\n").forEach(function (linea) {
      var m = linea.match(/^--\s*\[([^\]]+)\]/);
      if (m) { actual = m[1].trim(); partes[actual] = []; return; }
      if (/^--\s*##/.test(linea)) { actual = null; return; }
      if (/^--\s*Caso cerrado: sí/.test(linea)) { caso = true; return; }
      var r = linea.match(/^--\s*Resueltos de cambiar datos:(.*)$/);
      if (r) { r[1].split(",").forEach(function (x) { hechos[x.trim()] = true; }); return; }
      if (actual) partes[actual].push(linea);
    });
    return { partes: partes, caso: caso, hechos: hechos };
  }

  function cargarTrabajo(texto) {
    var leido = leerArchivo(texto);
    var conocidas = {};
    piezas().forEach(function (p) { conocidas[p.id] = p; });
    var ids = Object.keys(leido.partes).filter(function (id) { return conocidas[id] && recuadro(id); });
    if (!ids.length) {
      alert("Ese archivo no tiene consultas de esta página. Tiene que ser el que bajaste con Descargar mi trabajo.");
      return;
    }
    if (!confirm("Se van a cargar " + plural(ids.length, "consulta", "consultas") + " del archivo. Si en esos ejercicios ya tienes algo escrito, se cambiará por lo del archivo. ¿Seguir?")) return;
    var resueltos = 0;
    ids.forEach(function (id) {
      var sql = leido.partes[id].join("\n").trim();
      var area = recuadro(id);
      area.value = sql;
      area.dispatchEvent(new Event("input"));
      var m = marcadores[id];
      if (!m) return;
      var ok = false;
      if (sql) {
        abrirBD();   // cada consulta, contra los datos originales
        try {
          var res = ejecutar(sql).res;
          ok = corregir(m.ej, res).ok;
        } catch (e) { ok = false; }
      }
      // en los de cambiar datos puede quedar en el recuadro un SELECT de comprobación: vale lo apuntado en el archivo
      if (!ok && m.ej.verifica && leido.hechos[id]) ok = true;
      if (ok) { guardar("ok:" + id, "1"); resueltos++; } else { quitar("ok:" + id); }
      m.marcar(ok);
      actualizarProgreso(m.bloque);
    });
    abrirBD();
    pintarPanel();
    if (leido.caso) { guardar("caso", "cerrado"); marcarCaso(); }
    alert("Listo: " + plural(ids.length, "consulta cargada", "consultas cargadas") + ", " + plural(resueltos, "ejercicio resuelto", "ejercicios resueltos") + ".");
  }

  // ---------------------------------------------------------------- arranque
  function mostrar(id) {
    Object.keys(pestanas).forEach(function (k) {
      var activa = k === id;
      pestanas[k].setAttribute("aria-selected", activa ? "true" : "false");
      pestanas[k].tabIndex = activa ? 0 : -1;
      document.getElementById("sec-" + k).classList.toggle("activo", activa);
    });
    guardar("pestana", id);
    if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
    window.scrollTo(0, 0);
  }

  function montar() {
    var nav = document.getElementById("pestanas");
    var main = document.getElementById("contenido");
    main.innerHTML = "";
    var todos = DATOS.bloques.concat([DATOS.mision], DATOS.extras);
    // una fila del menú por nivel
    var grupos = DATOS.grupos;
    var fila = null;
    todos.forEach(function (b) {
      var g = grupos.filter(function (x) { return x[1] === b.id; })[0];
      if (g || !fila) {
        fila = el("div", { clase: "grupo", role: "presentation" }, [el("span", { clase: "grupo-nombre", texto: (g || grupos[0])[0] })]);
        nav.appendChild(fila);
      }
      var p = el("button", { clase: "pestana", role: "tab", type: "button", id: "tab-" + b.id, "aria-controls": "sec-" + b.id, onclick: function () { mostrar(b.id); } }, [b.pestana]);
      if (b.ejercicios || b.pasos) p.appendChild(el("span", { clase: "progreso", title: b.pasos ? "" : "Ejercicios resueltos" }));
      fila.appendChild(p);
      pestanas[b.id] = p;
      var seccion = b.pasos ? pintarMision(b) : pintarBloque(b);
      seccion.setAttribute("aria-labelledby", "tab-" + b.id);
      main.appendChild(seccion);
      actualizarProgreso(b);
    });
    main.appendChild(el("footer", { clase: "pie" }, [
      el("a", { href: "bar.db", download: "bar.db", texto: "Descargar la base de datos (bar.db)" }),
      el("button", { type: "button", texto: "Borrar mis consultas y mi progreso", onclick: function () {
        if (confirm("¿Seguro? Se borran todas tus consultas y los ejercicios resueltos de este navegador. Si quieres conservarlas, antes pulsa Descargar mi trabajo.")) { borrarTodo(); location.reload(); }
      } })
    ]));
    marcarCaso();
    var barra = nav.parentNode;
    function medirBarra() { document.documentElement.style.setProperty("--alto-pestanas", barra.offsetHeight + "px"); }
    medirBarra();
    window.addEventListener("resize", medirBarra);
    var inicial = (location.hash || "").slice(1);
    if (!pestanas[inicial]) inicial = leer("pestana");
    if (!pestanas[inicial]) inicial = todos[0].id;
    mostrar(inicial);
    nav.addEventListener("keydown", function (ev) {
      var ids = Object.keys(pestanas);
      var actual = ids.indexOf((document.activeElement && document.activeElement.id || "").replace(/^tab-/, ""));
      if (actual === -1) return;
      var siguiente = { ArrowRight: actual + 1, ArrowLeft: actual - 1, Home: 0, End: ids.length - 1 }[ev.key];
      if (siguiente === undefined) return;
      ev.preventDefault();
      var id = ids[(siguiente + ids.length) % ids.length];
      mostrar(id);
      pestanas[id].focus();
    });
    window.addEventListener("hashchange", function () {
      var id = location.hash.slice(1);
      if (pestanas[id]) mostrar(id);
    });
  }

  async function arrancar() {
    var estado = document.getElementById("estado-bd");
    try {
      SQL = await iniciarSQL();
      abrirBD();
    } catch (e) {
      estado.textContent = "Sin base de datos";
      document.getElementById("contenido").innerHTML = "";
      document.getElementById("contenido").appendChild(el("div", { clase: "aviso error", texto: "No se ha podido cargar SQLite en el navegador. Revisa la conexión a internet y recarga la página (F5)." }));
      return;
    }
    estado.textContent = "Base de datos lista";
    pintarPanel();
    montar();
    document.getElementById("btn-descargar").addEventListener("click", descargarTrabajo);
    var archivo = document.getElementById("archivo-trabajo");
    document.getElementById("btn-cargar").addEventListener("click", function () { archivo.value = ""; archivo.click(); });
    archivo.addEventListener("change", function () {
      var f = archivo.files && archivo.files[0];
      if (!f) return;
      var lector = new FileReader();
      lector.onload = function () { cargarTrabajo(String(lector.result || "")); };
      lector.readAsText(f, "utf-8");
    });
    if (!puedeGuardar) {
      document.getElementById("sin-guardar").hidden = false;
      window.addEventListener("beforeunload", function (ev) {
        if (hayAlgoEscrito()) { ev.preventDefault(); ev.returnValue = ""; }
      });
    }
    document.getElementById("btn-restaurar").addEventListener("click", function () {
      abrirBD();
      pintarPanel();
      estado.textContent = "Datos restaurados";
      setTimeout(function () { estado.textContent = "Base de datos lista"; }, 2500);
    });
    window.__bar = { ejecutar: ejecutar, huellas: huellas, comprobar: comprobar, comprobarPaso: comprobarPaso, comprobarClaves: comprobarClaves, corregir: corregir, centimos: centimos, leerArchivo: leerArchivo, cargarTrabajo: cargarTrabajo, datos: DATOS };
  }
  arrancar();
})();
</script>
